<!doctype html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTIS V1 · IROPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Azeret+Mono:wght@300;400;500&display=swap">
<style>
/* ===========================================================================
   MOTYW
   Skala chlodnych szarosci na ciemno, cieply papier na jasno. Jeden akcent
   (pomarancz) o roznej intensywnosci koduje wage informacji, blekit jest
   drugim glosem. Tokeny przepisane z loops.jsx co do wartosci.
   =========================================================================== */
:root{
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Azeret Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#DFD9CE; --surf:#F3EFE7; --surf2:#EBE5DA; --surf3:#E0D9CB;
  --bd:#C9C0AE; --bd2:#DAD3C5;
  --tx:#241F19; --tx2:#544B40; --tx3:#786E60;
  --bl:#2F5B78; --blS:rgba(47,91,120,.09); --blB:rgba(47,91,120,.30);
  --or:#9A4408; --orF:#C25A12; --orT:#FFF7EF;
  --orS:rgba(194,90,18,.11); --orB:rgba(194,90,18,.40); --orMid:#B04E0C;
  --shHi:0 10px 30px rgba(56,44,30,.16);
  --gridRGB:42,34,26; --gridA:.048;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --sOther:#B9B0A0;
  --ok:#3F7D3F; --okS:rgba(63,125,63,.12); --okB:rgba(63,125,63,.34);
  --warnC:#9A6A08; --warnS:rgba(154,106,8,.12); --warnB:rgba(154,106,8,.34);
  --crit:#A6392F; --critS:rgba(166,57,47,.12); --critB:rgba(166,57,47,.34);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111113; --surf:#18191B; --surf2:#212225; --surf3:#272A2D;
  --bd:#363A3F; --bd2:#2E3135;
  --tx:#EDEEF0; --tx2:#B0B4BA; --tx3:#7C838C;
  --bl:#7FA9CE; --blS:rgba(127,169,206,.11); --blB:rgba(127,169,206,.30);
  --or:#FFA057; --orF:#F76B15; --orT:#140B00;
  --orS:rgba(247,107,21,.12); --orB:rgba(247,107,21,.46); --orMid:#E08A3C;
  --shHi:0 12px 34px rgba(0,0,0,.46);
  --gridRGB:237,238,240; --gridA:.032;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --sOther:#5A6068;
  --ok:#5FBF5F; --okS:rgba(95,191,95,.13); --okB:rgba(95,191,95,.36);
  --warnC:#E0A93C; --warnS:rgba(224,169,60,.13); --warnB:rgba(224,169,60,.36);
  --crit:#E3695F; --critS:rgba(227,105,95,.13); --critB:rgba(227,105,95,.36);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;position:relative}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--tx3)}
*{scrollbar-width:thin}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--or);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#kratka{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(var(--gridRGB),var(--gridA)) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(var(--gridRGB),var(--gridA)) 1px,transparent 1px);
  background-size:24px 24px;background-position:-1px -1px;
  -webkit-mask-image:radial-gradient(120% 100% at 50% 0%,#000 0%,rgba(0,0,0,.45) 67%,transparent 100%);
  mask-image:radial-gradient(120% 100% at 50% 0%,#000 0%,rgba(0,0,0,.45) 67%,transparent 100%)}

/* ------------------------------------------------------------------ typy */
.lbl{font:500 9.5px/1.5 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--tx3)}
.val{font:400 13px/1.35 var(--mono);color:var(--tx);letter-spacing:-.01em}
.val.duza{font-size:21px}
.val.akc{color:var(--or)}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--tx3)}
h1{font:400 21px/1 var(--sans);letter-spacing:-.012em;margin:0;color:var(--tx)}
h2{font:400 17px/1.3 var(--sans);letter-spacing:-.01em;margin:0 0 5px;color:var(--tx)}
p.note{color:var(--tx2);font:400 12.5px/1.65 var(--sans);margin:0 0 14px;max-width:82ch}
code{font-family:var(--mono);font-size:.88em;background:var(--surf3);
  border:1px solid var(--bd2);padding:1px 5px;border-radius:2px;color:var(--or)}

/* ------------------------------------------------------------------ szkielet */
aside{position:fixed;top:0;left:0;bottom:0;z-index:45;width:272px;background:var(--surf);
  border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;
  transition:width .18s cubic-bezier(.2,.7,.3,1)}
body.rail aside{width:64px}
body.hidepanel aside{width:0;border-right:none}
.side-top{height:72px;display:flex;align-items:center;gap:11px;padding:0 10px 0 12px;
  border-bottom:1px solid var(--bd2);flex-shrink:0}
.znak{width:32px;height:32px;border-radius:16px;flex:none;display:grid;place-items:center;
  background:var(--orS);border:1px solid var(--orB)}
.znak svg{width:19px;height:19px}
.side-id{min-width:0;flex:1}
.side-id .n{display:flex;align-items:baseline;gap:7px}
.side-id .n b{font:500 15px/1 var(--sans);letter-spacing:.2em;color:var(--tx)}
.side-id .n i{font:400 10px/1 var(--mono);color:var(--or);font-style:normal}
.side-id .d{font:500 8px/1 var(--sans);letter-spacing:.22em;color:var(--tx3);margin-top:5px}
body.rail .side-id,body.rail .nav-lbl,body.rail .nav-grp,body.rail .side-foot .txt,
body.rail .side-foot .stan{display:none}
/* Przycisk zwijania zostaje takze w szynie, inaczej z trybu waskiego nie ma
   czym wrocic do pelnego panelu. */
body.rail .side-top{padding:0 6px;justify-content:center;gap:0}
body.rail .znak{display:none}
body.rail #zwin{margin:0 auto}
body.rail .navbtn{justify-content:center;padding:11px 0}

nav{flex:1;overflow-y:auto;padding:14px 9px 10px;display:flex;flex-direction:column;gap:5px}
.nav-grp{font:500 9.5px var(--sans);letter-spacing:.15em;text-transform:uppercase;
  color:var(--tx3);padding:18px 12px 8px}
.nav-grp:first-child{padding-top:4px}
.navbtn{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 11px;
  border-radius:5px;cursor:pointer;background:var(--surf);border:1px solid var(--bd2);
  border-left:3px solid transparent;color:var(--tx2);text-align:left;
  font:400 13.5px/1 var(--sans);transition:background .13s,border-color .13s,color .13s,transform .07s}
.navbtn:hover{background:var(--surf3);border-color:var(--bd);border-left-color:var(--orMid);color:var(--tx)}
.navbtn:active{transform:translateY(1px)}
.navbtn.on{background:var(--orS);border-color:var(--orB);border-left-color:var(--orF);
  color:var(--or);font-weight:500}
.navbtn .ic{width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;
  border:1px solid transparent;transition:all .13s}
.navbtn.on .ic{background:var(--orS);border-color:var(--orB)}
.navbtn .ic svg{width:15px;height:15px;fill:none;stroke:var(--tx3);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.navbtn.on .ic svg{stroke:var(--orF)}
.navbtn .cnt{margin-left:auto;font:400 10px/1 var(--mono);color:var(--tx3);
  background:var(--surf3);padding:3px 6px;border-radius:9px;min-width:20px;text-align:center}
.navbtn.on .cnt{color:var(--or);background:transparent}
body.rail .navbtn .cnt{position:absolute;top:4px;right:6px;margin:0;min-width:14px;padding:0 3px;
  background:var(--orF);color:var(--orT);font-size:8.5px;border-radius:7px}

.side-foot{border-top:1px solid var(--bd2);padding:11px 9px;flex-shrink:0;
  display:flex;flex-direction:column;gap:6px}
.side-foot .stan{padding:10px 12px;border:1px solid var(--bd2);border-radius:6px;
  display:flex;flex-direction:column;gap:7px}
.side-foot .stan .r{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.side-foot .stan .r span:first-child{font:500 9px var(--sans);letter-spacing:.15em;
  text-transform:uppercase;color:var(--tx3)}
.side-foot .txt{font:400 10.5px/1.5 var(--sans);color:var(--tx3);padding:0 3px}

main{margin-left:272px;min-width:0;transition:margin-left .18s cubic-bezier(.2,.7,.3,1)}
body.rail main{margin-left:64px}
body.hidepanel main{margin-left:0}
.wnetrze{padding:24px 32px 90px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  margin-bottom:26px;padding-bottom:16px;border-bottom:1px solid var(--bd2)}
.topbar .lewo{display:flex;align-items:center;gap:12px}
.zegar{display:flex;align-items:center;gap:20px}
.zegar .el{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.zegar .el .k{font:500 8px var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--tx3)}
.zegar .el .v{font:400 13.5px/1 var(--mono);color:var(--tx);font-variant-numeric:tabular-nums}
.zegar .el.akc .v{color:var(--or)}
.zegar .sep{width:1px;height:24px;background:var(--bd2)}
.marka{display:flex;align-items:center;gap:9px}
.marka .t{display:flex;flex-direction:column;gap:2px}
.marka .t .a{display:flex;align-items:baseline;gap:6px}
.marka .t .a b{font:500 14px/1 var(--sans);letter-spacing:.2em;color:var(--tx)}
.marka .t .a i{font:400 10px/1 var(--mono);color:var(--or);font-style:normal}
.marka .t .b{font:500 8px/1 var(--sans);letter-spacing:.22em;color:var(--tx3)}
.ikbtn{width:32px;height:32px;border-radius:5px;background:transparent;border:1px solid var(--bd);
  cursor:pointer;display:grid;place-items:center;flex:none;transition:background .13s,border-color .13s}
.ikbtn:hover{background:var(--surf3);border-color:var(--tx3)}
.ikbtn svg{width:15px;height:15px;fill:none;stroke:var(--tx2);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

@media(max-width:900px){
  aside{width:64px}
  aside .side-id,aside .nav-lbl,aside .nav-grp,aside .side-foot .txt,
  aside .side-foot .stan,aside #zwin{display:none}
  aside .side-top{padding:0;justify-content:center}
  aside .navbtn{justify-content:center;padding:11px 0}
  main{margin-left:64px}
  .wnetrze{padding:18px 18px 80px}
}

.widok{display:none}
.widok.on{display:block;animation:wjazd .26s cubic-bezier(.2,.7,.3,1) both}
@keyframes wjazd{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes wkarta{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes wlewo{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes puls{0%,100%{opacity:.45}50%{opacity:1}}
.puls{animation:puls 1.4s ease-in-out infinite}

/* ------------------------------------------------------------------ pasek kart */
.pasek-kart{display:flex;align-items:center;gap:6px;background:var(--bg);
  border-bottom:1px solid var(--bd);overflow-x:auto;overflow-y:hidden;
  padding:9px 14px;min-height:60px;position:sticky;top:0;z-index:24}
.kafel{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 9px;cursor:pointer;
  flex-shrink:0;border-radius:2px 12px 12px 2px;border:1px solid var(--bd2);
  border-left:3px solid var(--bd2);background:transparent;color:inherit;
  animation:wlewo .18s cubic-bezier(.2,.7,.3,1) both;
  transition:background .13s,border-color .13s,transform .07s}
.kafel:hover{background:var(--surf3);border-color:var(--bd)}
.kafel:active{transform:translateY(1px)}
.kafel.on{background:var(--surf);border-color:var(--orB);border-left-color:var(--orF)}
.kafel .nr{width:19px;height:19px;border-radius:4px;flex:none;display:grid;place-items:center;
  background:var(--surf2);border:1px solid var(--bd2);font:500 10px/1 var(--mono);color:var(--tx3)}
.kafel.on .nr{background:var(--orS);border-color:var(--orB);color:var(--or)}
.kafel .op{display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;text-align:left}
.kafel .op .a{font:400 12.5px/1 var(--mono);color:var(--tx2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.kafel.on .op .a{color:var(--or)}
.kafel .op .b{font:400 9.5px/1 var(--sans);color:var(--tx3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.kafel .kropka{width:5px;height:5px;border-radius:3px;flex:none;margin-left:auto;
  background:var(--tx3);opacity:.3}
.kafel .kropka.gotowa{background:var(--orF);opacity:1}
.kafel .x{background:transparent;border:0;cursor:pointer;width:19px;height:19px;border-radius:10px;
  font:400 14px/1 var(--sans);color:var(--tx3);flex:none;display:grid;place-items:center}
.kafel .x:hover{background:var(--surf3);color:var(--tx)}
.kafel.nowa{padding:10px 14px;color:var(--tx3);gap:8px}

/* ------------------------------------------------------------------ karty */
.karta{background:var(--surf);border:1px solid var(--bd);border-radius:5px;
  animation:wkarta .22s cubic-bezier(.2,.7,.3,1) both}
.karta > header{padding:14px 20px;border-bottom:1px solid var(--bd2);display:flex;
  justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.karta .tresc{padding:18px 20px}
.karta .tresc.plaska{padding:0}
.stos{display:flex;flex-direction:column;gap:14px}

.para{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dwukol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,412px);gap:18px;align-items:start}
.lepki{position:sticky;top:80px}
@media(max-width:1240px){.dwukol{grid-template-columns:minmax(0,1fr)}.lepki{position:static}}
@media(max-width:820px){.para{grid-template-columns:1fr}}

.metryki{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:20px}
.metryka{min-width:0}
.metryka .k{font:500 9.5px/1.5 var(--sans);letter-spacing:.13em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:5px}
.metryka .v{font:400 21px/1.2 var(--mono);color:var(--tx);letter-spacing:-.02em;overflow-wrap:anywhere}
.metryka .v.tekst{font-size:13px;line-height:1.45;letter-spacing:0}
.metryka .v .u{font-size:12px;color:var(--tx3);margin-left:3px;letter-spacing:0}
.metryka .d{font:400 10.5px/1.4 var(--sans);color:var(--tx3);margin-top:3px}

.wiersz{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:8px 0;border-bottom:1px solid var(--bd2)}
.wiersz:last-child{border-bottom:0}
.wiersz .e{font:400 11.5px/1.45 var(--sans);color:var(--tx2);min-width:0}
.wiersz .v{font:400 12px/1.45 var(--mono);color:var(--tx);text-align:right;overflow-wrap:anywhere}
.wiersz .v.akc{color:var(--or)}
.wiersz.pion{flex-direction:column;align-items:stretch;gap:5px}
.wiersz.pion .v{text-align:left;line-height:1.6}

.staty{display:flex;gap:1px;width:100%;flex-wrap:wrap;align-items:stretch}
.staty > div{flex:1 1 118px;min-width:100px;padding:7px 12px;background:var(--surf2);
  border-right:1px solid var(--bg)}
.staty > div:first-child{border-radius:5px 0 0 5px}
.staty > div:last-child{border-radius:0 5px 5px 0;border-right:0}
.staty .v{font:400 14px/1.2 var(--mono);color:var(--tx)}
.staty .k{font:400 9.5px/1.3 var(--sans);color:var(--tx3);margin-top:2px}
.staty .uwaga{display:flex;align-items:center;font:400 10px/1.4 var(--sans);color:var(--tx3);flex:1 1 150px}

/* ------------------------------------------------------------------ formanty */
.pole{display:flex;flex-direction:column;gap:6px;min-width:0}
select,input[type=text],input[type=number],textarea{font:400 12.5px/1.4 var(--mono);color:var(--tx);
  background:var(--bg);border:1px solid var(--bd);border-radius:3px;padding:9px 11px;
  width:100%;outline:none;transition:border-color .13s}
textarea{font-family:var(--sans);font-size:12px;line-height:1.5;resize:vertical;min-height:62px}
select{font-family:var(--sans);cursor:pointer;appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),
                   linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{border-color:var(--orB)}
option{background:var(--surf);color:var(--tx)}
input[type=range]{-webkit-appearance:none;appearance:none;height:3px;background:var(--surf3);
  border-radius:2px;outline:none;width:100%;padding:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  border-radius:8px;background:var(--or);cursor:pointer;border:none}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:8px;
  background:var(--or);cursor:pointer;border:none}
label.chk{display:flex;align-items:center;gap:8px;cursor:pointer;
  font:400 12.5px var(--sans);color:var(--tx2)}
label.chk input{accent-color:var(--orF);width:15px;height:15px}

.btn{font:500 12px/1 var(--sans);letter-spacing:.02em;padding:11px 17px;border-radius:3px;
  background:transparent;color:var(--tx2);border:1px solid var(--bd);cursor:pointer;
  transition:all .12s;white-space:nowrap;display:inline-flex;align-items:center;
  justify-content:center;gap:7px}
.btn:hover:not(:disabled){background:var(--surf3);color:var(--tx)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.pri{background:var(--or);color:var(--orT);border-color:transparent}
.btn.pri:hover:not(:disabled){background:var(--orMid)}
.btn.akt{background:var(--orS);color:var(--or);border-color:var(--orB)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.mala{font-size:10.5px;padding:7px 11px}
.btn.pelna{width:100%}

.zakladki{display:inline-flex;background:var(--surf2);border:1px solid var(--bd2);
  border-radius:6px;padding:2px;gap:2px;max-width:100%;overflow-x:auto}
.zakladki.pelne{display:flex;width:100%}
.zakladki button{padding:7px 14px;border-radius:4px;border:none;cursor:pointer;white-space:nowrap;
  background:transparent;color:var(--tx2);font:400 11.5px var(--sans);letter-spacing:.01em;
  flex-shrink:0;transition:background .12s,color .12s,transform .07s}
.zakladki.male button{padding:6px 11px;font-size:10.5px}
.zakladki.pelne button{flex:1}
.zakladki button:hover{background:var(--surf2)}
.zakladki button:active{transform:translateY(1px)}
.zakladki button.on{background:var(--surf);color:var(--or);font-weight:500;
  box-shadow:inset 0 0 0 1px var(--bd2)}

/* kalendarz doby operacyjnej */
.kal{display:flex;flex-direction:column;gap:9px;padding:10px 12px 12px;background:var(--surf2);
  border:1px solid var(--bd);border-radius:6px;width:330px;max-width:100%;flex-shrink:0;
  box-shadow:var(--shHi);position:relative;z-index:6}
.kal .gora{display:flex;align-items:center;justify-content:space-between;gap:9px}
.kal .mies{display:inline-flex;align-items:center;gap:2px;background:var(--surf);
  border:1px solid var(--bd2);border-radius:5px;padding:2px}
.kal .mies button{width:24px;height:24px;border-radius:3px;border:none;background:transparent;
  cursor:pointer;color:var(--tx2);font:400 12px var(--mono)}
.kal .mies button:hover{background:var(--surf3)}
.kal .mies span{font:400 12px var(--mono);color:var(--tx);padding:0 8px;white-space:nowrap}
.kal .siatka{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.kal .dn{font:500 8px var(--sans);letter-spacing:.1em;text-align:center;color:var(--tx3);
  padding-bottom:1px}
.kal .dn.we{color:var(--tx3);opacity:.6}
.kal .d{padding:7px 0;border-radius:4px;border:1px solid transparent;background:transparent;
  color:var(--tx3);opacity:.26;font:400 11.5px var(--mono);cursor:default}
.kal .d.czynny{background:var(--surf);border-color:var(--bd2);color:var(--tx);opacity:1;cursor:pointer}
.kal .d.czynny:hover{background:var(--surf3)}
.kal .d.akt{background:var(--orS);border-color:var(--orB);color:var(--or)}
.kal .stopka{font:400 10px/1.5 var(--sans);color:var(--tx3)}
.doba{display:inline-flex;align-items:center;gap:1px;flex-shrink:0;box-sizing:border-box;
  height:36px;background:var(--surf2);border:1px solid var(--bd2);border-radius:5px;padding:2px}
.doba button{height:30px;border-radius:4px;border:none;background:transparent;cursor:pointer;
  color:var(--tx2);font:400 13px var(--mono);transition:background .12s}
.doba button:hover:not(:disabled){background:var(--surf3)}
.doba button:disabled{opacity:.28;cursor:default}
.doba .strzalka{width:26px}
.doba .srodek{padding:0 12px;background:var(--surf);display:flex;align-items:center;gap:8px}
.doba .srodek .dz{font:400 12.5px/1 var(--mono);color:var(--or);letter-spacing:.02em}
.doba .srodek .dt{font:400 10px/1 var(--sans);color:var(--tx3)}

/* ------------------------------------------------------------------ znaczniki */
.zn{display:inline-flex;align-items:center;gap:5px;font:500 9.5px/1 var(--mono);
  letter-spacing:.06em;padding:4px 7px;border-radius:2px;background:var(--surf3);
  color:var(--tx2);border:1px solid transparent;white-space:nowrap}
.zn.akc{background:var(--orS);color:var(--or);border-color:var(--orB)}
.zn.nieb{background:var(--blS);color:var(--bl);border-color:var(--blB)}
.zn.ok{background:var(--okS);color:var(--ok);border-color:var(--okB)}
.zn.uwaga{background:var(--warnS);color:var(--warnC);border-color:var(--warnB)}
.zn.blok{background:var(--critS);color:var(--crit);border-color:var(--critB)}
.zn .kropka{width:6px;height:6px;border-radius:3px;background:currentColor;flex:none}

.komunikat{display:flex;gap:11px;padding:13px 16px;border-radius:4px;
  font:400 12.5px/1.6 var(--sans);border:1px solid;align-items:flex-start}
.komunikat svg{flex:none;width:16px;height:16px;margin-top:2px;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.komunikat.ok{background:var(--okS);border-color:var(--okB);color:var(--ok)}
.komunikat.uwaga{background:var(--warnS);border-color:var(--warnB);color:var(--warnC)}
.komunikat.blad{background:var(--critS);border-color:var(--critB);color:var(--crit)}
.komunikat.info{background:var(--blS);border-color:var(--blB);color:var(--bl)}
.komunikat .tresc{color:var(--tx);min-width:0}

.pusto{border:1px dashed var(--bd);border-radius:5px;padding:38px 26px;text-align:center;
  background:var(--surf)}
.pusto .t{font:500 13.5px var(--sans);color:var(--tx);margin-bottom:6px}
.pusto .d{font:400 12px/1.65 var(--sans);color:var(--tx3);max-width:58ch;margin:0 auto}

.laduje{display:inline-flex;align-items:center;gap:8px;font:400 11.5px var(--mono);color:var(--tx3)}
.laduje i{width:11px;height:11px;border:2px solid var(--bd);border-top-color:var(--orF);
  border-radius:50%;animation:obrot .7s linear infinite;display:block}
@keyframes obrot{to{transform:rotate(360deg)}}
.przyciemnij{opacity:.42;pointer-events:none;transition:opacity .12s}

/* ------------------------------------------------------------------ tabele */
.tw{overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{text-align:left;padding:9px 16px;border-bottom:1px solid var(--bd2);vertical-align:top}
th{position:sticky;top:0;z-index:1;background:var(--surf2);color:var(--tx3);
  font:500 9.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;
  border-bottom:1px solid var(--bd)}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--tx)}
th .ar{opacity:.3;margin-left:5px;font-size:8px}
th.act{color:var(--or)} th.act .ar{opacity:1}
td{font:400 12px/1.5 var(--sans);color:var(--tx2)}
td.num,th.num{text-align:right}
td.num{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--tx)}
td.mocno{color:var(--tx);font-weight:500}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surf2)}
tbody tr:last-child td{border-bottom:0}

.glowa,.rzad{display:grid;gap:10px;align-items:center}
.glowa{padding:12px 18px;border-bottom:1px solid var(--bd)}
.rzad{width:100%;padding:11px 18px;background:transparent;border:none;
  border-bottom:1px solid var(--bd2);cursor:pointer;text-align:left;color:inherit;font:inherit;
  transition:background .13s}
.rzad:hover{background:var(--surf2)}
.rzad.on{background:var(--surf2)}
.szeroko{overflow-x:auto}
.szeroko-in{min-width:820px}

/* ------------------------------------------------------------------ wykresy */
figure.wyk{margin:0;background:var(--surf);border:1px solid var(--bd);border-radius:5px;
  animation:wkarta .22s cubic-bezier(.2,.7,.3,1) both}
figure.wyk > header{padding:14px 20px 10px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
figure.wyk > header .tyt{flex:1;min-width:150px}
figure.wyk > header .pod{font:400 11.5px/1.55 var(--sans);color:var(--tx3);margin-top:4px;max-width:76ch}
.wyk .plotno{padding:0 16px 14px}
.wyk .plotno svg{display:block;width:100%;height:auto;overflow:visible}
.wyk .tabelka{display:none;border-top:1px solid var(--bd2)}
.wyk.tabela .plotno{display:none}
.wyk.tabela .tabelka{display:block}
.legenda{display:flex;gap:16px;flex-wrap:wrap;padding:0 20px 15px;
  font:400 10.5px var(--sans);color:var(--tx2)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:2px;flex:none}
.os{stroke:var(--bd);stroke-width:1;shape-rendering:crispEdges}
.krata{stroke:var(--bd2);stroke-width:1;shape-rendering:crispEdges}
.os-t{fill:var(--tx3);font:400 10px var(--mono);font-variant-numeric:tabular-nums}
.os-k{fill:var(--tx2);font:400 11px var(--sans)}
.wart-t{fill:var(--tx);font:400 11.5px var(--mono);font-variant-numeric:tabular-nums}
.traf{fill:transparent}

#dymek{position:fixed;z-index:100;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--surf);border:1px solid var(--bd);border-radius:4px;box-shadow:var(--shHi);
  padding:9px 12px;max-width:290px}
#dymek.on{opacity:1}
#dymek .t{font:500 11.5px var(--sans);color:var(--tx);margin-bottom:6px}
#dymek .r{display:flex;align-items:center;gap:8px;margin-top:4px}
#dymek .r i{width:12px;height:2px;border-radius:2px;flex:none}
#dymek .r .v{font:400 12px var(--mono);color:var(--tx);font-variant-numeric:tabular-nums}
#dymek .r .k{font:400 11px var(--sans);color:var(--tx3)}

/* ------------------------------------------------------------------ decyzja */
.decyzja{background:var(--surf);border:1px solid var(--orB);border-radius:5px;
  padding:22px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;
  box-shadow:inset 3px 0 0 0 var(--orF);
  animation:dec .42s cubic-bezier(.16,.84,.28,1) both}
@keyframes dec{0%{opacity:0;transform:translateY(10px) scale(.985)}60%{opacity:1}100%{opacity:1;transform:none}}
.decyzja .glowna{flex:1 1 300px;min-width:0}
.decyzja .nazwa{font:400 24px/1.28 var(--sans);color:var(--tx);margin-top:7px;letter-spacing:-.01em}
.decyzja .zdanie{font:400 13.5px/1.6 var(--sans);color:var(--or);margin-top:9px}
.decyzja .liczby{display:flex;gap:26px;flex-shrink:0}
.decyzja .liczby .duza{font:400 26px/1.1 var(--mono);color:var(--or);margin-top:6px}
.decyzja .liczby .duza.zwykla{color:var(--tx)}
.decyzja .liczby .pod{font:400 10px var(--sans);color:var(--tx3)}

.plaster{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:1px;
  background:var(--bd2);border:1px solid var(--bd2);border-radius:5px;overflow:hidden}
.plaster > div{background:var(--surf);padding:11px 14px}
.plaster .v{font:400 14px/1.3 var(--mono);color:var(--tx);margin-top:5px}
.plaster .d{font:400 9.5px/1.4 var(--sans);color:var(--tx3);margin-top:3px}

.kroki{margin:0;padding:0;list-style:none}
.kroki li{display:flex;gap:12px;padding:6px 0;align-items:baseline;
  animation:wlewo .3s cubic-bezier(.2,.7,.3,1) both}
.kroki li .n{font:400 10.5px var(--mono);color:var(--or);min-width:16px}
.kroki li .t{font:400 12.5px/1.6 var(--sans);color:var(--tx2)}
ul.zwykla{margin:6px 0;padding-left:20px;color:var(--tx2);font:400 12px/1.65 var(--sans)}
ul.zwykla li{margin:4px 0}
pre{background:var(--bg);border:1px solid var(--bd2);border-radius:3px;padding:14px 16px;
  margin:0;overflow:auto;max-height:440px;font:400 11.5px/1.7 var(--mono);
  white-space:pre-wrap;word-break:break-word;color:var(--tx2)}

/* ------------------------------------------------------------------ etapy */
.etapy{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
.etap{position:relative;background:var(--surf);border:1px solid var(--bd2);border-radius:5px;
  padding:11px 13px 11px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  overflow:hidden;transition:background .13s,border-color .13s,transform .07s}
.etap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bd)}
.etap:hover{background:var(--surf3)}
.etap:active{transform:translateY(1px)}
.etap.on{border-color:var(--orB);background:var(--orS)}
.etap.st-ok::before{background:var(--ok)}
.etap.st-degraded::before{background:var(--warnC)}
.etap.st-blocked::before{background:var(--crit)}
.etap .id{font:400 10px var(--mono);color:var(--tx3);letter-spacing:.04em}
.etap .ti{font:500 12.5px/1.35 var(--sans);color:var(--tx);margin:4px 0 8px}
.etap .io{font:400 10px/1.6 var(--mono);color:var(--tx3);word-break:break-word}
.etap .st{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}

details.rap{border:1px solid var(--bd2);border-radius:4px;background:var(--surf);overflow:hidden}
details.rap summary{cursor:pointer;padding:10px 14px;font:400 12px var(--sans);color:var(--tx2);
  display:flex;align-items:center;gap:10px;list-style:none}
details.rap summary::-webkit-details-marker{display:none}
details.rap summary::before{content:"›";color:var(--tx3);font-size:14px;transition:transform .15s;
  display:inline-block}
details.rap[open] summary::before{transform:rotate(90deg)}
details.rap summary:hover{background:var(--surf2)}
details.rap summary .sp{flex:1;min-width:0}
details.rap pre{border:0;border-top:1px solid var(--bd2);border-radius:0}

.rozdzial{display:grid;grid-template-columns:256px minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1000px){.rozdzial{grid-template-columns:1fr}}
.lista{background:var(--surf);border:1px solid var(--bd);border-radius:5px;
  max-height:620px;overflow-y:auto}
.lista button{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--bd2);padding:12px 15px;font:inherit;cursor:pointer;
  color:inherit;border-left:3px solid transparent;transition:background .12s}
.lista button:last-child{border-bottom:0}
.lista button:hover{background:var(--surf2)}
.lista button.on{background:var(--orS);border-left-color:var(--orF)}
.lista .rid{font:400 12px var(--mono);color:var(--tx);letter-spacing:-.01em}
.lista button.on .rid{color:var(--or)}
.lista .rm{display:block;font:400 10.5px var(--sans);color:var(--tx3);margin-top:4px}

.slup{height:3px;background:var(--surf3);border-radius:2px;overflow:hidden}
.slup i{display:block;height:100%;background:var(--tx3);transition:width .35s cubic-bezier(.2,.7,.3,1)}
.slup i.akc{background:var(--orF)}

/* rotacje, wykres pasmowy */
.gantt-wrap{overflow:auto;max-height:66vh}
.gantt-ruler{display:flex;position:sticky;top:0;z-index:3;background:var(--surf);
  border-bottom:1px solid var(--bd)}
.gantt-etyk{flex:0 0 116px;width:116px;position:sticky;left:0;z-index:4;background:var(--surf);
  padding:9px 0 9px 18px;box-sizing:border-box}
.gantt-row{display:flex;border-bottom:1px solid var(--bd2);background:var(--surf)}
.gantt-row:hover{background:var(--surf2)}
.gantt-reg{flex:0 0 116px;width:116px;position:sticky;left:0;z-index:2;background:inherit;
  padding:9px 0 9px 18px;box-sizing:border-box;border-right:1px solid var(--bd2)}
.gantt-reg .r{font:400 11.5px var(--mono);color:var(--tx)}
.gantt-reg .s{font:400 9.5px var(--sans);color:var(--tx3);margin-top:2px}
.gantt-tor{position:relative;height:46px;flex:none}
.gantt-odc{position:absolute;top:11px;height:24px;border-radius:2px;background:var(--orS);
  border:1px solid var(--orB);display:flex;align-items:center;padding:0 5px;overflow:hidden;
  cursor:pointer;transition:background .12s}
.gantt-odc:hover{background:var(--orB)}
.gantt-odc span{font:400 9.5px/1 var(--mono);color:var(--or);white-space:nowrap}
.gantt-tik{position:absolute;top:0;bottom:0;border-left:1px solid var(--bd2)}

/* ------------------------------------------------------------------ odstepy
   Elementy siatki maja domyslnie `min-width:auto`, wiec dluga tresc rozpycha
   kolumne zamiast sie zawinac i sasiedzi zaczynaja na siebie nachodzic.
   Zerowanie tego w jednym miejscu naprawia wszystkie takie przypadki naraz. */
.staty > div,.plaster > div,.metryka,.rzad > *,.glowa > *,.wiersz > *,
.dwukol > *,.para > *,.decyzja > *,.kafel .op{min-width:0}
.rzad > span,.glowa > div{overflow:hidden;text-overflow:ellipsis}
.decyzja .liczby{flex-wrap:wrap;gap:20px 26px}
.decyzja .nazwa{overflow-wrap:anywhere}
.topbar{row-gap:12px}
.staty{gap:1px}
.staty .v{overflow-wrap:anywhere}
.karta > header .lbl{overflow-wrap:anywhere}
.zn{max-width:100%;overflow:hidden;text-overflow:ellipsis}
figure.wyk > header .pod,.karta > header .mono{overflow-wrap:anywhere}
@media(max-width:1400px){.dwukol{grid-template-columns:minmax(0,1fr) minmax(0,360px)}}
@media(max-width:1100px){
  .wnetrze{padding:20px 20px 80px}
  .zegar .el:not(.akc){display:none}
}
@media(max-width:760px){
  .zegar{display:none}
  .marka .t{display:none}
  .metryki{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:14px}
}

#toast{position:fixed;right:20px;bottom:20px;z-index:60;max-width:390px;background:var(--surf);
  border:1px solid var(--blB);border-radius:6px;padding:14px 16px;box-shadow:var(--shHi);
  display:none;gap:12px;align-items:flex-start;
  animation:tost .32s cubic-bezier(.16,.84,.28,1) both}
#toast.on{display:flex}
@keyframes tost{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#toast .p{width:7px;height:7px;border-radius:4px;background:var(--bl);flex:none;margin-top:5px}
#toast .m{flex:1;min-width:0;font:400 12.5px/1.55 var(--sans);color:var(--tx)}
#toast .x{background:transparent;border:0;cursor:pointer;width:20px;height:20px;border-radius:10px;
  font:400 14px/1 var(--sans);color:var(--tx3);flex:none}
#toast .x:hover{background:var(--surf3);color:var(--tx)}
</style>

<div id="kratka" aria-hidden="true"></div>

<aside>
  <div class="side-top">
    <span class="znak" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">

        <path d="M12 8.4a3.6 3.6 0 1 0 2.6 1.1" stroke="var(--tx3)" stroke-width="2.1" stroke-linecap="round"/>

<script>
"use strict";
/* ==========================================================================
   PODSTAWY
   ========================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
};
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const NF  = new Intl.NumberFormat("pl-PL", { maximumFractionDigits: 2 });
const NF0 = new Intl.NumberFormat("pl-PL", { maximumFractionDigits: 0 });
const num = v => NF0.format(Math.round(Number(v) || 0));
const n = v => typeof v === "number" ? NF.format(v) : esc(v);

/* Money z silnika przychodzi jako {minor, currency, major} */
const isM = v => v && typeof v === "object" && "minor" in v && "currency" in v;
const m   = v => isM(v) ? NF.format(Number(v.major)) + " " + v.currency : n(v);
const mv  = v => isM(v) ? Number(v.major) : (Number(v) || 0);
const cell = v => isM(v) ? m(v) : n(v);

function compact(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return NF.format(Math.round(v / 1e5) / 10) + " mln";
  if (a >= 1e4) return NF0.format(Math.round(v / 1e3)) + " tys.";
  return NF0.format(Math.round(v));
}
/** Godzina i minuta z ISO w UTC, opcjonalnie przesunieta do czasu lokalnego portu. */
function hhmm(iso, offsetMin = 0) {
  const t = new Date(iso).getTime() + offsetMin * 60000;
  const d = new Date(t);

/* ==========================================================================
   TABELA sortowalna, sluzy tez za blizniaka tabelarycznego wykresow
   ========================================================================== */
function tabela(kol, wiersze, opcje = {}) {
  const wrap = el("div", "tw");
  const t = el("table"), head = el("thead"), hr = el("tr");
  let sortIdx = opcje.sort ?? -1, sortDir = opcje.dir ?? -1;
  kol.forEach((c, i) => {
    const th = el("th", (c.num ? "num " : "") + (opcje.sortable === false ? "" : "sort"));
    th.append(document.createTextNode(c.t));
    if (opcje.sortable !== false) {
      th.append(el("span", "ar", "▲"));
      th.onclick = () => { sortDir = sortIdx === i ? -sortDir : -1; sortIdx = i; rysuj(); };
    }
    hr.append(th);
  });
  head.append(hr); t.append(head);
  const body = el("tbody"); t.append(body);
  function rysuj() {
    $$("th", hr).forEach((th, i) => {
      th.classList.toggle("act", i === sortIdx);
      const ar = $(".ar", th);
      if (ar) ar.textContent = i === sortIdx ? (sortDir < 0 ? "▼" : "▲") : "▲";
    });
    let list = wiersze.slice();
    if (sortIdx >= 0) {
      const c = kol[sortIdx], key = c.val || (r => c.get(r));
      list.sort((a, b) => {
        const x = key(a), y = key(b);
        if (typeof x === "number" && typeof y === "number") return (x - y) * sortDir;
        return String(x).localeCompare(String(y), "pl") * sortDir;
      });
    }
    body.innerHTML = "";
    for (const r of list) {
      const tr = el("tr");
      kol.forEach(c => {
        const td = el("td", (c.num ? "num " : "") + (c.mocno ? "mocno" : ""));
        const v = c.get(r);
        if (c.raw) td.innerHTML = v;
        else td.textContent = v === null || v === undefined ? "brak" : String(v);
        tr.append(td);
      });
      body.append(tr);
    }
  }
  rysuj();
  wrap.append(t);
  if (wiersze.length <= 20) wrap.style.maxHeight = "none";
  else wrap.style.maxHeight = opcje.wys || "58vh";
  return wrap;
}

const DAY_W_LOCIE = {};
async function doba(dzien = ST.dzien) {
  if (DAY[dzien]) return DAY[dzien];
  /* Przy starcie o dobe pyta i pulpit, i inicjalizacja. Bez tego oba zadania
     szly na serwer, a tam budowa snapshotu jest pod blokada silnika, wiec
     drugie czekalo pelne dwie sekundy i blokowalo pozostale wywolania. */
  if (!DAY_W_LOCIE[dzien]) {
    DAY_W_LOCIE[dzien] = api(`/api/day?day=${dzien}&seed=${ST.ziarno}`)
      .then(d => { DAY[dzien] = d; return d; })
      .finally(() => { delete DAY_W_LOCIE[dzien]; });

}
/* ==========================================================================
   KALENDARZ DOBY OPERACYJNEJ
   Silnik pracuje na dobie tygodnia 0-6, bo siatka jest tygodniowa. Zeby dalo
   sie ja wskazac datą, tydzien operacyjny jest przypiety do poniedzialku
   7 wrzesnia 2026. Pozostale dni miesiaca sa wygaszone, bo nie ma dla nich
   siatki: klikniecie w nie nie mialoby czego zbudowac.
   ========================================================================== */
const OKRES = { rok: 2026, mies: 8, pierwszy: 7, ostatni: 13 };
const MIESKR = ["STY", "LUT", "MAR", "KWI", "MAJ", "CZE",
                "LIP", "SIE", "WRZ", "PAŹ", "LIS", "GRU"];
const MIESPL = ["styczeń", "luty", "marzec", "kwiecień", "maj", "czerwiec",
                "lipiec", "sierpień", "wrzesień", "październik", "listopad", "grudzień"];
/** Data operacyjna dla doby tygodnia: 0 to poniedzialek 7 wrzesnia. */
const dataDoby = dzien =>
  `${OKRES.rok}-${String(OKRES.mies + 1).padStart(2, "0")}-` +
  `${String(OKRES.pierwszy + dzien).padStart(2, "0")}`;

const KAL = { rok: OKRES.rok, mies: OKRES.mies, otwarty: false };

function wyborDoby(onZmiana) {
  const zmien = d => { ST.dzien = d; zapiszUst(); onZmiana(); };
  if (!KAL.otwarty) {
    const w = el("div", "doba");
    const lewo = el("button", "strzalka", "‹");
    const srodek = el("button", "srodek");
    const prawo = el("button", "strzalka", "›");
    srodek.title = "Rozwiń kalendarz";
    srodek.innerHTML = `<span class="dz">${esc(DNIL[ST.dzien])}</span>` +
      `<span class="dt">${esc(dataPelna(dataDoby(ST.dzien)))}</span>`;
    lewo.disabled = ST.dzien <= 0;
    prawo.disabled = ST.dzien >= 6;
    lewo.onclick = () => zmien(ST.dzien - 1);
    prawo.onclick = () => zmien(ST.dzien + 1);
    srodek.onclick = () => { KAL.otwarty = true; onZmiana(); };
    w.append(lewo, srodek, prawo);
    return w;
  }

  const w = el("div", "kal");
  const gora = el("div", "gora");
  const mies = el("div", "mies");
  const wstecz = el("button", null, "‹"), naprzod = el("button", null, "›");
  const etyk = el("span", null, `${MIESKR[KAL.mies]} ${KAL.rok}`);
  wstecz.onclick = () => {
    KAL.mies -= 1;
    if (KAL.mies < 0) { KAL.mies = 11; KAL.rok -= 1; }
    onZmiana();
  };
  naprzod.onclick = () => {
    KAL.mies += 1;
    if (KAL.mies > 11) { KAL.mies = 0; KAL.rok += 1; }
    onZmiana();
  };
  mies.append(wstecz, etyk, naprzod);
  gora.append(mies);
  const zwin = el("button", "btn mala", "Zwiń");
  zwin.onclick = () => { KAL.otwarty = false; onZmiana(); };
  gora.append(zwin);
  w.append(gora);

  const siatka = el("div", "siatka");
  DNI.forEach((n, i) => siatka.append(el("div", "dn" + (i >= 5 ? " we" : ""), n)));
  const pierwszy = new Date(Date.UTC(KAL.rok, KAL.mies, 1));
  const przesun = (pierwszy.getUTCDay() + 6) % 7;
  const ile = new Date(Date.UTC(KAL.rok, KAL.mies + 1, 0)).getUTCDate();
  for (let i = 0; i < przesun; i++) siatka.append(el("div"));
  for (let dzien = 1; dzien <= ile; dzien++) {
    const czynny = KAL.rok === OKRES.rok && KAL.mies === OKRES.mies &&
      dzien >= OKRES.pierwszy && dzien <= OKRES.ostatni;
    const idx = dzien - OKRES.pierwszy;
    const b = el("button", "d" + (czynny ? " czynny" : "") +
      (czynny && idx === ST.dzien ? " akt" : ""), String(dzien));
    b.disabled = !czynny;
    b.title = czynny ? DNIL[idx] : "poza tygodniem operacyjnym";
    if (czynny) b.onclick = () => { KAL.otwarty = false; zmien(idx); };
    siatka.append(b);
  }
  w.append(siatka);
  w.append(el("div", "stopka",
    `${OKRES.pierwszy}–${OKRES.ostatni} ${MIESPL[OKRES.mies]} ${OKRES.rok}`));
  return w;
}
const portNazwa = (d, iata) => (d.porty[iata] && d.porty[iata].nazwa) || iata;
const offsetPortu = (d, iata) => (d.porty[iata] && d.porty[iata].tz_offset) || 0;
/** Godzina odlotu i przylotu w wybranej przez uzytkownika strefie. */
function godzina(d, rejs, ktora) {
  const iso = ktora === "sta" ? rejs.sta : rejs.std;
  const port = ktora === "sta" ? rejs.do : rejs.z;
  return ST.czas === "utc" ? hhmm(iso, 0) : hhmm(iso, offsetPortu(d, port));
}

/* ==========================================================================
   PASEK KART
   Kilka analiz naraz, tak jak w loops. Kazda karta trzyma wlasny rejs,
   parametry zdarzenia i policzony wynik, wiec mozna porownywac warianty
   bez utraty poprzedniego przebiegu.
   ========================================================================== */
function nowaKarta() {
  if (ST.karty.length >= ST.MAKS_KART) { powiadom("Osiągnięto limit kart."); return; }
  const id = "k" + (++ST.licznik);
  ST.karty.push({
    id, rejs: null, dzien: ST.dzien,
    rodzaj: "brak", min: ST.domMin, szacOd: 0, szacDo: 0, horyzont: 180,
    kod: "", nadsprzedaz: 0, pref: [], priorytet: ST.priorytet,
    kontekst: "", persona: "", sucho: true,
    wynik: null, ai: null, laduje: false, zak: "pax",
  });
  ST.akt = id;
  rysujPasekKart();
  WIDOKI.pulpit();
}
function zamknijKarte(id) {
  const i = ST.karty.findIndex(k => k.id === id);
  if (i < 0) return;
  ST.karty.splice(i, 1);
  if (ST.akt === id) ST.akt = (ST.karty[Math.max(0, i - 1)] || {}).id || null;
  rysujPasekKart();
  WIDOKI.pulpit();
}
const aktKarta = () => ST.karty.find(k => k.id === ST.akt) || null;
function ustawKarte(patch) {
  const k = aktKarta();
  if (!k) return;
  Object.assign(k, patch);
  rysujPasekKart();
}

function rysujPasekKart() {
  const p = $("#pasek-kart");
  p.innerHTML = "";
  ST.karty.forEach((k, i) => {
    const d = DAY[k.dzien];
    const r = k.rejs && d ? d.rejsy.find(x => x.id === k.rejs) : null;
    const b = el("div", "kafel" + (k.id === ST.akt ? " on" : ""));
    b.style.width = r ? "204px" : "128px";
    b.onclick = () => { ST.akt = k.id; rysujPasekKart(); WIDOKI.pulpit(); };
    b.innerHTML =
      `<span class="nr">${i + 1}</span>` +
      `<span class="op"><span class="a">${esc(r ? r.nr : "pusta")}</span>` +
      `<span class="b">${r ? `${esc(r.z)}–${esc(r.do)} · ${esc(DNI[k.dzien])}` +
        `${k.rodzaj !== "brak" && k.min > 0 ? ` · +${k.min}` : ""}` : "bez rejsu"}</span></span>` +
      `<span class="kropka${k.wynik ? " gotowa" : ""}"></span>`;
    const x = el("button", "x", "×");
    x.title = "Zamknij kartę";
    x.onclick = ev => { ev.stopPropagation(); zamknijKarte(k.id); };
    b.append(x);
    p.append(b);
  });
  const plus = el("button", "kafel nowa");
  plus.title = "Nowa karta";
  plus.disabled = ST.karty.length >= ST.MAKS_KART;
  plus.innerHTML = `<span style="font-size:15px">+</span>` +
    (ST.karty.length ? "" : `<span style="font:400 11.5px var(--sans)">Nowa karta</span>`);
  plus.onclick = nowaKarta;
  p.append(plus);
}

/* ==========================================================================
   OS CZASU REJSU
   Odlot, przylot planowy, przylot z opoznieniem oraz progi EU261:
   opieka wedlug kategorii odleglosci i trzy godziny dla odszkodowania.
   ========================================================================== */
function osCzasu(d, r, min) {
  const W = 1000, pad = 52, y = 62, H = 126;
  const t0 = new Date(r.std).getTime() / 60000 - 45;
  const tSta = new Date(r.sta).getTime() / 60000;
  const t1 = Math.max(tSta + min + 80, tSta + 160);
  const X = t => pad + Math.max(0, Math.min(1, (t - t0) / (t1 - t0))) * (W - pad * 2);
  const s = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "oś czasu rejsu" });
  const C = k => CSSv(k);

  const tAbs = new Date(r.std).getTime() / 60000;
  s.append(sv("line", { class: "os", x1: pad, x2: W - pad, y1: y, y2: y }));
  s.append(sv("line", { x1: X(tAbs), x2: X(tSta), y1: y, y2: y, stroke: C("--tx3"), "stroke-width": 2 }));
  if (min > 0)
    s.append(sv("line", { x1: X(tSta), x2: X(tSta + min), y1: y, y2: y,
      stroke: C("--orF"), "stroke-width": 2 }));

  /* Progi: opieka wedlug kategorii odleglosci i odszkodowanie od trzech godzin.
     Dla kategorii B oba wypadaja na 180 min, wiec dwie etykiety staly jedna nad
     druga w tym samym miejscu i wygladaly na blad. Gdy sie pokrywaja, rysujemy
     jeden znacznik z obiema nazwami. */
  const progi = r.prog_opieki === 180
    ? [[180, "opieka i 3 h", 21]]
    : [[r.prog_opieki, "opieka", 21], [180, "3 h", 34]];
  progi.forEach(([prog, label, dy]) => {
    const t = tSta + prog;
    if (X(t) <= pad + 8 || X(t) >= W - pad - 8) return;
    const akt = min >= prog;
    s.append(sv("line", { x1: X(t), x2: X(t), y1: y - 7, y2: y + 7,
      stroke: akt ? C("--orF") : C("--bd"), "stroke-width": 1, "stroke-dasharray": "2 2" }));
    const e = txt(label, { x: X(t), y: y + dy, "text-anchor": "middle",
      fill: akt ? C("--or") : C("--tx3") });
    e.setAttribute("style", "font:500 7.5px var(--sans);letter-spacing:.09em;text-transform:uppercase");
    s.append(e);
  });

  const punkty = [
    { t: tAbs, g: godzina(d, r, "std"), op: "odlot " + r.z, kol: C("--tx2"), rr: 3.2 },
    { t: tSta, g: godzina(d, r, "sta"), op: "przylot planowy", kol: C("--tx3"), rr: 3.2 },
  ];
  if (min > 0) punkty.push({
    t: tSta + min, g: hhmm(new Date(new Date(r.sta).getTime() + min * 60000).toISOString(),
      ST.czas === "utc" ? 0 : offsetPortu(d, r.do)),
    op: "przylot z opóźnieniem", kol: C("--orF"), rr: 4.4, akc: true,
  });
  let ost = -1e9;
  punkty.sort((a, b) => a.t - b.t).forEach(p => {
    const px = X(p.t);
    p.dol = px - ost < 138;
    if (!p.dol) ost = px;
  });
  punkty.forEach(p => {
    s.append(sv("circle", { cx: X(p.t), cy: y, r: p.rr,
      fill: p.akc ? C("--orF") : C("--surf"), stroke: p.kol, "stroke-width": 1.5 }));
    const g = txt(p.g, { x: X(p.t), y: p.dol ? y + 52 : y - 16, "text-anchor": "middle",
      fill: p.akc ? C("--or") : C("--tx") });
    g.setAttribute("style", "font:400 10.5px var(--mono)");
    s.append(g);
    const o = txt(p.op, { x: X(p.t), y: p.dol ? y + 63 : y - 27, "text-anchor": "middle", fill: C("--tx3") });
    o.setAttribute("style", "font:500 7.5px var(--sans);letter-spacing:.08em;text-transform:uppercase");
    s.append(o);
  });
  return s;
}

WIDOKI.pulpit = async function () {
  const host = $("#w-pulpit");
  const k = aktKarta();
  if (!k) { rysujPulpitPusty(host); return; }
  let d;

/**
 * Wiersz przesiadki. Rejs przesiadkowy jest prawdziwym rejsem z tej doby,
 * wiec pokazujemy jego pelna trase i calą podroz pasazera: dowoz MUC-WAW przy
 * rejsie WAW-JFK znaczy, ze te osoby leca MUC-JFK z przesiadka w Warszawie.
 * Caly wiersz jest klikalny i przenosi na ten rejs.
 */
function wierszPrzesiadki(d, r, t, min, kierunek) {
  const rejs = d.rejsy.find(x => x.id === t.id);
  const zost = kierunek === "dalej" ? t.zapas - min : t.zapas + min;
  const zag = zost < 0;
  const trasa = rejs ? `${rejs.z}–${rejs.do}` : "";
  /* Cala podroz pasazera, nie tylko odcinek przesiadkowy. Gdy poczatek rowna
     sie koncowi, to rejs powrotny, a nie blad w danych, wiec nazywamy go
     wprost zamiast pokazywac mylace "WAW-WAW". */
  const przez = !rejs ? ""
    : kierunek === "dalej"
      ? (r.z === rejs.do ? `powrót do ${r.z} przez ${r.do}` : `${r.z}–${rejs.do} przez ${r.do}`)
      : (rejs.z === r.do ? `powrót do ${rejs.z} przez ${r.z}` : `${rejs.z}–${r.do} przez ${r.z}`);
  const b = el("button", "rzad");
  b.style.cssText = "grid-template-columns:78px 128px minmax(0,1fr) 52px 84px;" +
    "padding:9px 0;border-bottom:none;border-top:1px solid var(--bd2)";
  b.disabled = !rejs;
  if (rejs) b.title = `Otwórz ${rejs.nr} ${rejs.z}–${rejs.do}, odlot ${godzina(d, rejs, "std")}`;
  b.innerHTML =

/* ==========================================================================
   WYKRESY: inline SVG bez bibliotek
   ========================================================================== */
const NS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs = {}) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};
const txt = (s, attrs = {}) => { const e = sv("text", attrs); e.textContent = s; return e; };
const CSSv = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const SERIE = () => ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7"].map(CSSv);
const AKC = () => CSSv("--orF");

function slupekH(x, y, w, h, r = 3) {
  r = Math.max(0, Math.min(r, w, h / 2));
  if (w <= 0.5) return `M${x},${y} h0.5 v${h} h-0.5 Z`;
  return `M${x},${y} H${x + w - r} A${r},${r} 0 0 1 ${x + w},${y + r} V${y + h - r} ` +
         `A${r},${r} 0 0 1 ${x + w - r},${y + h} H${x} Z`;
}
function slupekV(x, yTop, w, h, r = 3) {
  r = Math.max(0, Math.min(r, w / 2, h));
  if (h <= 0.5) return `M${x},${yTop + h} h${w} v-0.5 h${-w} Z`;
  return `M${x},${yTop + h} V${yTop + r} A${r},${r} 0 0 1 ${x + r},${yTop} H${x + w - r} ` +
         `A${r},${r} 0 0 1 ${x + w},${yTop + r} V${yTop + h} Z`;
}
function dzialki(max, ile = 5) {
  if (!(max > 0)) return [0];
  const raw = max / ile, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].find(s => s * mag >= raw) * mag;
  const out = [];
  for (let v = 0; v <= max + step * 0.001; v += step) out.push(v);
  return out;
}

const DYM = $("#dymek");
function dymPokaz(ev, tytul, wiersze) {
  DYM.innerHTML = "";
  const h = el("div", "t"); h.textContent = tytul; DYM.append(h);
  for (const [k, v, c] of wiersze) {
    const rr = el("div", "r");
    if (c) { const i = el("i"); i.style.background = c; rr.append(i); }
    const vv = el("span", "v"); vv.textContent = v; rr.append(vv);
    const kk = el("span", "k"); kk.textContent = k; rr.append(kk);
    DYM.append(rr);
  }
  DYM.classList.add("on");
  dymRuch(ev);
}
function dymRuch(ev) {
  const p = 14, w = DYM.offsetWidth, h = DYM.offsetHeight;
  let x = ev.clientX + p, y = ev.clientY + p;
  if (x + w > innerWidth - 8) x = ev.clientX - w - p;
  if (y + h > innerHeight - 8) y = ev.clientY - h - p;
  DYM.style.left = Math.max(8, x) + "px";
  DYM.style.top = Math.max(8, y) + "px";
}
const dymSchowaj = () => DYM.classList.remove("on");
function czuly(node, tytul, wiersze) {
  node.addEventListener("pointerenter", e => dymPokaz(e, tytul, wiersze));
  node.addEventListener("pointermove", dymRuch);
  node.addEventListener("pointerleave", dymSchowaj);
  node.setAttribute("tabindex", "0");
  node.addEventListener("focus", () => {
    const b = node.getBoundingClientRect();
    dymPokaz({ clientX: b.left + b.width / 2, clientY: b.top }, tytul, wiersze);
  });
  node.addEventListener("blur", dymSchowaj);
}

function wykres(o) {

function wykSlupkiH(wiersze, o = {}) {
  const W = 900, padL = o.labelW ?? 170, padR = 100, padT = 8, padB = 30;
  const skok = o.skok ?? 40, gr = Math.min(22, skok - 16);
  const H = padT + wiersze.length * skok + padB;
  const s = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const kolor = o.kolor || AKC(), neut = CSSv("--tx3"), pow = CSSv("--surf");
  const hi = Math.max(...wiersze.map(r => Math.max(r.value, r.high ?? 0)), 0);
  const max = hi > 0 ? hi * 1.02 : 1;
  const x0 = padL, x1 = W - padR;
  const X = v => x0 + (Math.max(0, v) / max) * (x1 - x0);
  for (const t of dzialki(max, 5)) {
    s.append(sv("line", { class: "krata", x1: X(t), x2: X(t), y1: padT, y2: padT + wiersze.length * skok }));
    s.append(txt(o.fmtOs ? o.fmtOs(t) : compact(t),
      { class: "os-t", x: X(t), y: H - padB + 17, "text-anchor": "middle" }));
  }
  s.append(sv("line", { class: "os", x1: x0, x2: x0, y1: padT, y2: padT + wiersze.length * skok }));
  wiersze.forEach((r, i) => {
    const y = padT + i * skok, cy = y + skok / 2;
    s.append(txt(r.label, { class: "os-k", x: x0 - 10, y: cy + 4, "text-anchor": "end" }));
    s.append(sv("path", { d: slupekH(x0, cy - gr / 2, X(r.value) - x0, gr, 3), fill: kolor }));
    if (r.low !== undefined && r.high !== undefined && r.high > r.low) {
      const a = X(r.low), b = X(r.high), t = cy - gr / 2 - 4, u = cy + gr / 2 + 4;
      /* Was lezy czesciowo na slupku, wiec kazdy jego element dostaje najpierw
         grubsza otoczke w kolorze powierzchni. Bez niej robi sie brudna smuga. */
      const kreska = (x1c, y1c, x2c, y2c, w) => {
        s.append(sv("line", { x1: x1c, x2: x2c, y1: y1c, y2: y2c, stroke: pow,
          "stroke-width": w + 3, "stroke-linecap": "round" }));
        s.append(sv("line", { x1: x1c, x2: x2c, y1: y1c, y2: y2c, stroke: neut, "stroke-width": w }));
      };
      kreska(a, cy, b, cy, 1.5);
      kreska(a, t, a, u, 2);
      kreska(b, t, b, u, 2);
    }
    s.append(txt(o.fmtEt ? o.fmtEt(r) : compact(r.value),
      { class: "wart-t", x: Math.max(X(r.value), X(r.high ?? 0)) + 9, y: cy + 4 }));
    const hit = sv("rect", { class: "traf", x: 0, y, width: W, height: skok });
    czuly(hit, r.label, r.dym || [[o.jedn || "", (o.fmtEt ? o.fmtEt(r) : compact(r.value)), kolor]]);
    s.append(hit);
  });
  return s;
}

function wykKolumny(wiersze, o = {}) {
  const W = 900, padL = 48, padR = 12, padT = 14, padB = 34, plot = o.height ?? 165;
  const H = padT + plot + padB;
  const s = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const kolor = o.kolor || AKC();
  const max = Math.max(...wiersze.map(r => r.value), 0) * 1.08 || 1;
  const x0 = padL, x1 = W - padR, y1 = padT + plot;
  const pas = (x1 - x0) / wiersze.length, gr = Math.min(24, pas - 8);
  const Y = v => y1 - (Math.max(0, v) / max) * plot;
  for (const t of dzialki(max, 4)) {
    s.append(sv("line", { class: "krata", x1: x0, x2: x1, y1: Y(t), y2: Y(t) }));
    s.append(txt(compact(t), { class: "os-t", x: x0 - 9, y: Y(t) + 4, "text-anchor": "end" }));
  }
  s.append(sv("line", { class: "os", x1: x0, x2: x1, y1: y1, y2: y1 }));
  wiersze.forEach((r, i) => {
    const bx = x0 + i * pas + (pas - gr) / 2;
    s.append(sv("path", { d: slupekV(bx, Y(r.value), gr, y1 - Y(r.value), 3), fill: kolor }));
    s.append(txt(r.label, { class: "os-t", x: bx + gr / 2, y: y1 + 15, "text-anchor": "middle" }));
    const hit = sv("rect", { class: "traf", x: x0 + i * pas, y: padT, width: pas, height: plot });
    czuly(hit, r.title || r.label, r.dym || [[o.jedn || "", compact(r.value), kolor]]);
    if (o.klik) { hit.style.cursor = "pointer"; hit.addEventListener("click", () => o.klik(r, i)); }
    s.append(hit);
  });
  return s;
}

function wykSkladane(wiersze, kolorOf, o = {}) {
  const W = 900, padL = o.labelW ?? 150, padR = 112, padT = 6, padB = 30;
  const skok = 40, gr = 22;
  const H = padT + wiersze.length * skok + padB;
  const s = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const max = Math.max(...wiersze.map(r => r.total), 0) * 1.02 || 1;
  const x0 = padL, x1 = W - padR;
  const X = v => x0 + (Math.max(0, v) / max) * (x1 - x0);
  for (const t of dzialki(max, 5)) {
    s.append(sv("line", { class: "krata", x1: X(t), x2: X(t), y1: padT, y2: padT + wiersze.length * skok }));
    s.append(txt(compact(t), { class: "os-t", x: X(t), y: H - padB + 17, "text-anchor": "middle" }));
  }
  s.append(sv("line", { class: "os", x1: x0, x2: x0, y1: padT, y2: padT + wiersze.length * skok }));
  wiersze.forEach((r, i) => {
    const y = padT + i * skok, cy = y + skok / 2, top = cy - gr / 2;
    s.append(txt(r.label, { class: "os-k", x: x0 - 10, y: cy + 4, "text-anchor": "end" }));
    let acc = 0;
    r.parts.forEach((p, j) => {
      const a = X(acc), b = X(acc + p.value);
      const przerwa = j < r.parts.length - 1 ? 2 : 0;
      const w = Math.max(0, b - a - przerwa);
      const ostatni = j === r.parts.length - 1;
      const dd = ostatni ? slupekH(a, top, w, gr, 3) : `M${a},${top} h${w} v${gr} h${-w} Z`;
      const seg = sv("path", { d: dd, fill: kolorOf(p.key) });
      czuly(seg, r.label, [[p.key, o.fmt ? o.fmt(p.value) : compact(p.value), kolorOf(p.key)]]);
      s.append(seg);
      acc += p.value;
    });
    s.append(txt(o.fmt ? o.fmt(r.total) : compact(r.total),
      { class: "wart-t", x: X(r.total) + 9, y: cy + 4 }));
  });
  return s;
}

const KLASA_KODU = {

  d: ["kod reakcyjny, dziedziczy przyczynę", ""],
};
const opisKlasy = k => KLASA_KODU[k] || ["do oceny indywidualnej", "nieb"];

function panelZdarzenia(d, k, r, min) {

    { male: true, pelne: true });
  c.tresc.append(P("Rodzaj zdarzenia", zRodzaj));

  if (k.rodzaj !== "brak") {
    /* Wszystkie 76 kodow AHM730 z bazy, pogrupowane w sekcje. Panel pokazywal
       wczesniej cztery wybrane recznie, co ukrywalo wiekszosc przyczyn. */
    const sel = el("select");

          .sort((a, b) => a[0].localeCompare(b[0], "pl"))
          .map(([sekcja, lista]) =>
            `<optgroup label="${esc(sekcja)}">` +
            lista.map(x => `<option value="${esc(x.kod)}"${x.kod === k.kod ? " selected" : ""}>` +
              `${esc(x.kod)} ${esc(x.alfa)} · ${esc(x.opis)}</option>`).join("") +
            `</optgroup>`).join("");
    } else {
      sel.innerHTML = `<option value="${esc(k.kod)}">${esc(k.kod)}</option>`;
    }
    sel.onchange = () => { ustawKarte({ kod: sel.value, wynik: null, ai: null }); WIDOKI.pulpit(); };
    const info = kodInfo(k.kod);
    const [opisK, kindK] = opisKlasy(info.klasa);

        ? `<div style="display:flex;gap:6px;flex-wrap:wrap">${znacz(opisK, kindK)}` +
          `${info.alfa ? znacz(info.alfa, "nieb") : ""}` +
          `${info.sekcja ? znacz(info.sekcja) : ""}</div>`
        : "")));
  }

  if (k.rodzaj === "znane") {
    /* Sam suwak, bez gotowych przyciskow: liczba ma byc wpisana swiadomie,
       a nie wybrana z podpowiedzi, ktore sugeruja typowe wartosci. */
    const box = el("div");
    box.style.cssText = "display:flex;flex-direction:column;gap:7px";
    const sl = el("input");
    sl.type = "range"; sl.min = "0"; sl.max = "720"; sl.step = "5"; sl.value = k.min || 0;
    const pod = el("div");
    pod.style.cssText = "display:flex;justify-content:space-between;align-items:baseline;gap:10px";
    const odczyt = () =>
      `<span style="font:400 9.5px var(--sans);color:var(--tx3)">0</span>` +
      `<span style="font:400 15px var(--mono);color:var(--or)">${sl.value} min` +
      `<span style="font-size:10px;color:var(--tx3);margin-left:6px">${hmn(+sl.value)}</span></span>` +
      `<span style="font:400 9.5px var(--sans);color:var(--tx3)">12 h</span>`;
    pod.innerHTML = odczyt();
    sl.oninput = () => { pod.innerHTML = odczyt(); };
    sl.onchange = () => { ustawKarte({ min: +sl.value || 0, wynik: null, ai: null }); WIDOKI.pulpit(); };
    box.append(sl, pod);
    c.tresc.append(P("Czas opóźnienia", box));
  }
  if (k.rodzaj === "szac") {
    const row = el("div");
    row.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap";
    const mk = (key, val) => {
      const i = el("input");
      i.type = "number"; i.min = "0"; i.max = "1440"; i.value = val;
      i.style.width = "78px";
      i.onchange = () => { ustawKarte({ [key]: +i.value || 0, wynik: null, ai: null }); WIDOKI.pulpit(); };
      return i;
    };
    row.append(el("span", "mono", "od"), mk("szacOd", k.szacOd),
               el("span", "mono", "do"), mk("szacDo", k.szacDo), el("span", "mono", "min"));
    const presety = el("div");
    presety.style.cssText = "display:flex;gap:4px;flex-wrap:wrap;margin-top:6px";
    [[15, 45], [30, 90], [60, 120], [120, 240]].forEach(([a, b]) => {
      const btn = el("button", "btn mala" + (+k.szacOd === a && +k.szacDo === b ? " akt" : ""), `${a}–${b}`);
      btn.onclick = () => { ustawKarte({ szacOd: a, szacDo: b, wynik: null, ai: null }); WIDOKI.pulpit(); };
      presety.append(btn);
    });
    c.tresc.append(P("Przedział czasowy", row, presety));
  }
  if (k.rodzaj === "nieznane") {
    c.tresc.append(el("div", "komunikat info",
      `<svg viewBox="0 0 16 16">${IK.info}</svg><div class="tresc">` +
      `Horyzont roboczy ${k.horyzont} min.</div>`));
  }

  if (k.rodzaj !== "brak") {
    const progi = el("div");
    progi.style.cssText = "display:flex;gap:6px;flex-wrap:wrap";
    progi.innerHTML =
      znacz(`opieka od ${r.prog_opieki} min`, min >= r.prog_opieki ? "akc" : "") +
      znacz(`${r.odszkodowanie} EUR od 180 min`, min >= 180 ? "akc" : "") +
      (r.intra ? znacz("wewnątrzunijny") : "") +
      (min >= 180 ? znacz("próg 3 h przekroczony", "blok")
                  : znacz(`do progu 3 h brakuje ${180 - min} min`, "nieb"));
    c.tresc.append(progi);
  }

  /* ---- priorytet ---- */
  const prio = k.priorytet ?? ST.priorytet;
  const pbx = el("div");
  pbx.style.cssText = "display:flex;flex-direction:column;gap:7px";
  const psl = el("input");
  psl.type = "range"; psl.min = "0"; psl.max = "100"; psl.step = "5"; psl.value = prio;
  const ppod = el("div");
  const rysujPrio = v => {
    ppod.innerHTML =
      `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">` +
      `<span style="font:400 9.5px var(--sans);color:var(--tx3)">najlepszy wynik</span>` +
      `<span style="font:400 13px var(--mono);color:var(--or)">${v}</span>` +
      `<span style="font:400 9.5px var(--sans);color:var(--tx3)">pasażer</span></div>`;
  };
  rysujPrio(prio);
  psl.oninput = () => rysujPrio(+psl.value);
  psl.onchange = () => {
    ST.priorytet = +psl.value;
    zapiszUst();
    ustawKarte({ priorytet: +psl.value, wynik: null });
    WIDOKI.pulpit();
  };
  pbx.append(psl, ppod);
  c.tresc.append(P("Priorytet", pbx));

  /* ---- liczba rezerwacji ----
     Suwak ustawia CALKOWITA liczbe rezerwacji, nie roznice wobec manifestu.
     Przy delcie nie bylo widac, czy siedem osob wiecej to jeszcze wolne fotele,
     czy juz nadsprzedaz, wiec zmiana liczby pasazerow nie dawala zadnej
     odpowiedzi. Teraz punktem odniesienia jest pojemnosc kabiny. */
  const rezerwacje = r.pax + (+k.nadsprzedaz || 0);
  const obox = el("div");
  obox.style.cssText = "display:flex;flex-direction:column;gap:7px";
  const osl = el("input");
  osl.type = "range";
  osl.min = "0";
  osl.max = String(r.miejsca + 40);
  osl.step = "1";
  osl.value = rezerwacje;
  const opod = el("div");
  const rysujNad = v => {
    const odm = Math.max(0, v - r.miejsca);
    opod.innerHTML =
      `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">` +
      `<span style="font:400 15px var(--mono);color:${odm ? "var(--or)" : "var(--tx)"}">${v}</span>` +
      `<span style="font:400 10.5px var(--sans);color:var(--tx3)">` +
      `${r.miejsca} miejsc${v !== r.pax ? `, manifest ${r.pax}` : ""}</span></div>` +
      (odm
        ? `<div style="font:400 10.5px/1.55 var(--sans);color:var(--or);margin-top:4px">` +
          `nadsprzedaż ${odm}, Art. 4 ust. 3, ${num(odm * r.odszkodowanie)} EUR</div>`
        : `<div style="font:400 10.5px/1.55 var(--sans);color:var(--tx3);margin-top:4px">` +
          `${r.miejsca - v} miejsc wolnych</div>`);
  };
  rysujNad(rezerwacje);
  osl.oninput = () => rysujNad(+osl.value);
  osl.onchange = () => {
    ustawKarte({ nadsprzedaz: Math.max(0, (+osl.value || 0) - r.pax), wynik: null });
    WIDOKI.pulpit();
  };
  obox.append(osl, opod);
  c.tresc.append(P("Rezerwacje", obox));

  /* ---- preferowane przebukowania ---- */
  const pbox = el("div");
  pbox.style.cssText = "display:flex;flex-direction:column;gap:6px";
  (k.pref || []).forEach((p, i) => {
    const row = el("div");
    row.style.cssText = "display:grid;grid-template-columns:1fr 62px 60px 30px;gap:5px";
    const mk = (val, ph, key, typ) => {
      const inp = el("input");
      inp.type = typ || "text"; inp.value = val; inp.placeholder = ph;
      inp.style.cssText = "padding:7px 9px;font-size:11.5px";
      inp.onchange = () => {
        const nowe = (k.pref || []).slice();
        nowe[i] = { ...nowe[i], [key]: typ === "number" ? (+inp.value || 0) : inp.value.toUpperCase() };
        ustawKarte({ pref: nowe });
      };
      return inp;
    };
    row.append(mk(p.nr || "", "LO123", "nr"), mk(p.pax || "", "pax", "pax", "number"),
               mk(p.cel || "", "cel", "cel"));
    const usun = el("button", "btn mala", "×");
    usun.style.padding = "7px 0";
    usun.onclick = () => { ustawKarte({ pref: k.pref.filter((_, j) => j !== i) }); WIDOKI.pulpit(); };
    row.append(usun);
    pbox.append(row);
  });
  const dodaj = el("button", "btn mala", "Dodaj rejs");
  dodaj.onclick = () => {
    ustawKarte({ pref: [...(k.pref || []), { nr: "", pax: "", cel: "" }] });
    WIDOKI.pulpit();
  };
  pbox.append(dodaj);
  c.tresc.append(P("Preferowane przebukowania", pbox));

  const ta = el("textarea");
  ta.placeholder = "Okoliczności, których nie ma w danych. Trafia do promptu warstwy AI.";
  ta.value = k.kontekst;
  ta.onchange = () => ustawKarte({ kontekst: ta.value });
  c.tresc.append(P("Kontekst dla warstwy AI", ta));

  const nadmiar = Math.max(0, r.pax + (+k.nadsprzedaz || 0) - r.miejsca);
  const jestCoLiczyc = min > 0 || nadmiar > 0;
  const btn = el("button", "btn pri pelna", k.laduje ? "Analizuję…"
    : jestCoLiczyc ? "Przelicz decyzję" : "Ustaw opóźnienie albo rezerwacje");
  btn.disabled = k.laduje || !jestCoLiczyc;
  if (k.laduje) btn.classList.add("puls");
  btn.onclick = () => przeliczDecyzje(k, r, min);
  c.tresc.append(btn);

  kol.append(c);
  return kol;
}

/* ==========================================================================
   URUCHOMIENIE SILNIKA I WARSTWY AI
   ========================================================================== */
async function przeliczDecyzje(k, r, min) {
  k.laduje = true;
  WIDOKI.pulpit();
  try {
    const wynik = await api("/api/run", {
      day: k.dzien,
      flight: r.id,
      delay: min,
      /* Brak zdarzenia czasowego znaczy brak kodu opoznienia. Node 04 dobierze
         wtedy 14 PO, bo sama nadsprzedaz to nie jest usterka techniczna. */
      code: (k.rodzaj === "brak" || !k.kod) ? null : k.kod,
      overbooking: +k.nadsprzedaz || 0,
      priorytet: undefined,
      priority: k.priorytet ?? ST.priorytet,
      preset: ST.preset,
      decision: "ACCEPT",
    });
    k.wynik = wynik;
    k.ai = null;
    if (!ST.moje.some(x => x.id === wynik.id)) {
      ST.moje.unshift({
        id: wynik.id, nr: r.nr, trasa: `${r.z}–${r.do}`, dzien: k.dzien,
        data: dataDoby(k.dzien), min, nadsprzedaz: +k.nadsprzedaz || 0,
        decyzja: (wynik.karta && wynik.karta.option_id) || "",
      });
    }
    LICZ.raporty = ST.moje.length;
    budujNav();
    powiadom(`${r.nr} ${r.z}–${r.do}: ${(wynik.karta && wynik.karta.label) || "policzone"}`);
  } catch (e) {
    k.wynik = null;
    powiadom("Silnik nie policzył: " + e.message);
  } finally {
    k.laduje = false;
    WIDOKI.pulpit();
  }
}

/* Trzy rodzaje raportu. Kazdy to inna persona warstwy AI, czyli inny zestaw
   etapow, ktore model w ogole widzi. Redaktor komunikatow czyta tylko etapy
   pasazerskie, wiec nie ma z czego wypisac kwoty wewnetrznej. */
const RODZAJE_RAPORTU = [
  { k: "operacyjny", n: "Raport operacyjny", persona: "dyspozytor" },
  { k: "finansowy", n: "Raport finansowy", persona: "analityk" },
  { k: "prawny", n: "Raport prawny", persona: "prawnik" },
];
const RAPORTY_AI = {};      /* RAPORTY_AI[runId][rodzaj] = wynik albo stan */

async function generujRaport(runId, rodzaj) {
  const def = RODZAJE_RAPORTU.find(x => x.k === rodzaj);
  if (!def) return;
  RAPORTY_AI[runId] = RAPORTY_AI[runId] || {};
  RAPORTY_AI[runId][rodzaj] = { laduje: true };
  pokazRun(runId);
  try {
    const sucho = !(ZDROWIE && ZDROWIE.klucz_api);
    const d = await api("/api/ai", {
      run: runId, dry_run: sucho, personas: [def.persona], question: "",
    });
    RAPORTY_AI[runId][rodzaj] = { ...d.wyniki[0], sucho, rodzaj };
  } catch (e) {
    RAPORTY_AI[runId][rodzaj] = { error: e.message, rodzaj };
  }
  pokazRun(runId);
}

/* ==========================================================================
   WYNIK DECYZJI
   ========================================================================== */
function rysujWynik(d, k, r, min) {
  const w = k.wynik;
  const stos = el("div", "stos");
  const rek = (w.ranking || []).find(x => x.pozycja === 1) || null;
  const karta_ = w.karta;
  const ai = k.ai;

  if (w.zatrzymany) stos.append(komunikat("blad", `Przepływ zatrzymany: <b>${esc(w.powod)}</b>`));
  if (w.eskalacja) {
    const a = w.eskalacja.addressee || {};
    stos.append(komunikat("uwaga",
      `<b>Eskalacja, brak dopuszczalnej opcji.</b> Wszystkie opcje odpadły na filtrze prawnym. ` +
      `Adresat: ${esc(a.role || "?")} (${esc(a.channel || "")}), SLA ${esc(w.eskalacja.sla_minutes)} min.`));
  }

  /* ---- jedno zdanie: co robimy i ile to kosztuje ---- */
  const dec = el("div", "decyzja");
  const glowna = el("div", "glowna");
  glowna.innerHTML =
    `<div class="lbl">Decyzja</div>` +
    `<div class="nazwa">${esc(karta_ ? karta_.label : (rek ? rek.opcja : "brak dopuszczalnej opcji"))}</div>` +
    (karta_ ? `<div class="zdanie">${esc(karta_.option_id)}, autoryzacja ${esc(karta_.authorization_role || "brak")}` +
      `${karta_.second_signature ? ", wymaga drugiego podpisu" : ""}.</div>` : "");
  const zdania = [];
  if (rek) {
    zdania.push(`Strata oczekiwana ${m(rek.strata)}, widełki ${m(rek.min)} do ${m(rek.max)}.`);
    if (mv(rek.oszczednosc)) zdania.push(`O ${m(rek.oszczednosc)} mniej niż opcja domyślna.`);
    if (rek.uwaga) zdania.push(rek.uwaga.charAt(0).toUpperCase() + rek.uwaga.slice(1) + ".");
  }
  const n12 = w.nodes.find(x => x.node === "12");
  if (n12 && n12.ostrzezen) zdania.push(`${n12.ostrzezen} opcji odpadło na filtrze prawnym.`);
  if (karta_ && karta_.pax_offloaded)
    zdania.push(`${num(karta_.pax_offloaded)} pasażerów nie leci tym rejsem.`);
  if (zdania.length) glowna.append(el("div", "zdanie", esc(zdania.join(" "))));
  dec.append(glowna);
  const liczby = el("div", "liczby");
  liczby.innerHTML =
    `<div><div class="lbl">Koszt</div><div class="duza">` +
    `${karta_ ? NF0.format(mv(karta_.cost_expected)) : (rek ? NF0.format(mv(rek.strata)) : "brak")}</div>` +
    `<div class="pod">PLN oczekiwany</div></div>` +
    `<div><div class="lbl">Pasażerowie</div><div class="duza zwykla">${num(r.pax)}</div>` +
    `<div class="pod">objętych decyzją</div></div>`;
  dec.append(liczby);
  stos.append(dec);

  /* ---- co ta decyzja oznacza w liczbach ---- */
  const plaster = el("div", "plaster");
  const poz = [
    ["Odszkodowanie EU261",
      min >= 180 ? `${r.odszkodowanie} EUR na pasażera` : "nie należy się",
      min >= 180 ? "próg 3 h przekroczony" : `do progu 3 h brakuje ${180 - min} min`],
    ["Opieka Art. 9", min >= r.prog_opieki ? "należna" : "poniżej progu",
      `próg ${r.prog_opieki} min dla kategorii ${r.tier}`],
    ["Przesiadki",
      r.dalej.length ? `${r.dalej.filter(t => t.zapas - min < 0).reduce((a, b) => a + b.pax, 0)} z ` +
        `${r.dalej.reduce((a, b) => a + b.pax, 0)} traci` : "brak dalszych",
      r.dalej.length ? `${r.dalej.length} kierunków` : "wszyscy kończą podróż"],
    ["Widełki straty", rek ? `${compact(mv(rek.min))} do ${compact(mv(rek.max))}` : "brak",
      "z kwantyli rzeczywistych operacji"],
    ["Budżet silnika", `${Math.round(w.budzet.elapsed_ms)} ms`,
      `z ${num(w.budzet.total_ms)} ms, tryb ${w.budzet.level}`],
    ["Etapy", `${w.nodes.length}`,
      `${w.nodes.filter(x => x.status === "degraded").length} degradowanych, ` +
      `${w.nodes.filter(x => x.status === "blocked").length} zablokowanych`],
  ];
  poz.forEach(([e, v, dd]) => plaster.append(el("div", null,
    `<div class="lbl">${esc(e)}</div><div class="v">${esc(v)}</div><div class="d">${esc(dd)}</div>`)));
  stos.append(plaster);

  /* ---- karta wykonania ---- */
  if (karta_) {
    const c = karta("Karta wykonania", null, el("span", "zn akc", esc(karta_.option_id || "")));
    c.tresc.append(el("div", "lbl", "Co się zmienia"));
    const ul = el("ul", "kroki");
    (karta_.what_changes || []).forEach((x, i) => {
      const li = el("li");
      li.style.animationDelay = (i * 70) + "ms";
      li.innerHTML = `<span class="n">${i + 1}</span><span class="t">${esc(x)}</span>`;
      ul.append(li);
    });
    c.tresc.append(ul);
    if ((karta_.crew_actions || []).length) {
      c.tresc.append(el("div", "lbl", "Załoga"));
      c.tresc.append(el("ul", "zwykla", karta_.crew_actions.map(x => `<li>${esc(x)}</li>`).join("")));
    }
    if (karta_.pax_offloaded)
      c.tresc.append(komunikat("uwaga",
        `<b>${num(karta_.pax_offloaded)} pasażerów schodzi z rejsu.</b> Kolejność wg priorytetu, ` +
        `pasażerowie chronieni na końcu.`));
    const mt = el("div", "metryki");
    mt.style.cssText = "margin-top:16px;padding-top:14px;border-top:1px solid var(--bd2)";
    [["Koszt minimalny", m(karta_.cost_low)], ["Oczekiwany", m(karta_.cost_expected)],
     ["Maksymalny", m(karta_.cost_high)],
     ["Autoryzacja", (karta_.authorization_role || "brak") + (karta_.second_signature ? " + 2. podpis" : "")],
     ["Ważna do", utcTxt(karta_.valid_until) || "brak"]].forEach(([t, v]) =>
      mt.append(el("div", "metryka",
        `<div class="k">${esc(t)}</div><div class="v" style="font-size:14px">${esc(v)}</div>`)));
    c.tresc.append(mt);
    if (karta_.threshold_note)
      c.tresc.append(el("p", "note", esc(karta_.threshold_note)));
    stos.append(c);
  }

  /* ---- ranking wariantow ---- */
  if ((w.ranking || []).length) {
    const wiersze = w.ranking.map(x => ({
      label: x.opcja, value: mv(x.strata), low: mv(x.min), high: mv(x.max),
      dym: [["strata oczekiwana", m(x.strata), AKC()],
            ["widełki", `${m(x.min)} do ${m(x.max)}`, null],
            ...(mv(x.oszczednosc) !== 0 ? [["oszczędność", m(x.oszczednosc), null]] : []),
            ...(x.uwaga ? [["uwaga", x.uwaga, null]] : [])],
      _r: x,
    }));
    stos.append(wykres({
      tytul: "Rozważone warianty, strata oczekiwana",
      podpis: "słupek strata oczekiwana, wąsy widełki min do max",
      svg: wykSlupkiH(wiersze, { labelW: 180, skok: 44,
        fmtEt: x => m(x._r.strata), fmtOs: v => compact(v) + " zł" }),
      tabela: tabela([
        { t: "#", num: true, get: x => x._r.pozycja, val: x => x._r.pozycja },
        { t: "Opcja", get: x => x._r.opcja, mocno: true },
        { t: "Strata", num: true, get: x => m(x._r.strata), val: x => mv(x._r.strata) },
        { t: "Min", num: true, get: x => m(x._r.min), val: x => mv(x._r.min) },
        { t: "Maks", num: true, get: x => m(x._r.max), val: x => mv(x._r.max) },
        { t: "Oszczędność", num: true, get: x => m(x._r.oszczednosc), val: x => mv(x._r.oszczednosc) },
        { t: "Uwaga", get: x => x._r.uwaga || "brak" },
      ], wiersze, { sort: 0, dir: 1 }),
    }));
  }

  /* ---- status etapow ---- */
  const detal = el("div");
  const sk = karta("Status etapów");
  const siatka = el("div", "etapy");
  w.nodes.forEach(x => {
    const b = el("button", `etap st-${x.status}`);
    b.innerHTML =
      `<div class="id">${esc(x.node)} · ${n(x.ms)} ms</div>` +
      `<div class="ti">${esc(x.tytul)}</div>` +
      `<div class="st">${zn(x.status)}` +
      `${x.ostrzezen ? znacz(`${x.ostrzezen} ostrz.`, "uwaga") : ""}` +
      `${x.braki ? znacz(`${x.braki} braków`) : ""}</div>`;
    b.onclick = () => {
      $$(".etap", siatka).forEach(z => z.classList.toggle("on", z === b));
      pokazEtap(detal, x);
    };
    siatka.append(b);
  });
  sk.tresc.append(siatka);
  stos.append(sk);
  stos.append(detal);

  const stopka = el("div");
  stopka.style.cssText = "display:flex;gap:10px;flex-wrap:wrap";
  const b1 = el("button", "btn", "Otwórz pełny raport tego runu");
  b1.onclick = () => { idzDo("raporty"); setTimeout(() => pokazRun(w.id), 200); };
  stopka.append(b1);
  stos.append(stopka);
  return stos;
}

function pokazEtap(host, x) {
  host.innerHTML = "";
  const c = karta(`${x.node} ${x.tytul}`, null,
    el("div", null, zn(x.status) + ` <span class="mono">${n(x.ms)} ms</span>`));
  c.tresc.append(el("p", "note", esc(x.podsumowanie || "brak podsumowania")));
  if ((x.warnings || []).length) {
    c.tresc.append(el("div", "lbl", "Ostrzeżenia"));
    c.tresc.append(el("ul", "zwykla", x.warnings.map(v => `<li>${esc(v)}</li>`).join("")));
  }
  if ((x.data_gaps || []).length) {
    c.tresc.append(el("div", "lbl", "Braki danych"));
    c.tresc.append(el("ul", "zwykla", x.data_gaps.map(v => `<li>${esc(v)}</li>`).join("")));
  }
  host.append(c);
  host.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
