const F = { rejsy: { q: "", sekt: "", kier: "", ile: 60, otw: null },
            zalogi: { q: "", rola: "" },
            rotacje: { q: "", typ: "" } };
const BAZY_LOT = ["WAW", "KRK", "GDN", "WRO", "POZ", "KTW", "RZE"];

function sektorRejsu(d, r) {
  const a = d.porty[r.z] || {}, b = d.porty[r.do] || {};
  if (a.tz === "Europe/Warsaw" && b.tz === "Europe/Warsaw") return "kraj";
  return (a.schengen && b.schengen) ? "schengen" : "non";
}
const SEKT_PL = { kraj: "krajowy", schengen: "Schengen", non: "non-Schengen" };

WIDOKI.rejsy = async function () {
  const host = $("#w-rejsy");
  if (!host.children.length) { host.innerHTML = ""; host.append(laduje("wczytuję dobę")); }
  let d;
  try { d = await doba(); } catch (e) { blad(host, e); return; }
  const f = F.rejsy;
  host.innerHTML = "";
  const stos = el("div", "stos");

  const filtry = karta();
  filtry.tresc.style.cssText = "display:flex;flex-direction:column;gap:10px";
  const g1 = el("div");
  g1.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start";
  g1.append(wyborDoby(() => WIDOKI.rejsy()));
  const inp = el("input");
  inp.type = "text"; inp.value = f.q;
  inp.placeholder = "Numer rejsu, port, trasa albo znak maszyny";
  inp.style.cssText = "flex:1 1 240px;min-width:180px;height:36px;padding:0 12px;font-size:13px";
  inp.oninput = () => { f.q = inp.value; f.ile = 60; rysujTabeleRejsow(); };
  g1.append(inp);
  const selS = el("select");
  selS.style.cssText = "width:176px;height:36px;padding:0 30px 0 11px;flex:none";
  selS.innerHTML = [["", "wszystkie sektory"], ["kraj", "krajowe"], ["schengen", "Schengen"],
    ["non", "non-Schengen"]].map(([v, l]) =>
    `<option value="${v}"${v === f.sekt ? " selected" : ""}>${esc(l)}</option>`).join("");
  selS.onchange = () => { f.sekt = selS.value; f.ile = 60; rysujTabeleRejsow(); };
  g1.append(selS);
  filtry.tresc.append(g1);
  filtry.tresc.append(zakladki([["", "Wszystkie"], ["out", "Odloty z bazy"], ["in", "Przyloty do bazy"]],
    f.kier, v => { f.kier = v; f.ile = 60; WIDOKI.rejsy(); }, { male: true }));
  const statyBox = el("div");
  filtry.tresc.append(statyBox);
  stos.append(filtry);

  const tabelaBox = el("section", "karta");
  const tabelaTresc = el("div", "tresc plaska");
  tabelaBox.append(tabelaTresc);
  stos.append(tabelaBox);
  host.append(stos);

  function widoczne() {
    const q = f.q.trim().toUpperCase();
    return d.rejsy.filter(o =>
      (!f.sekt || sektorRejsu(d, o) === f.sekt) &&
      (!f.kier || (f.kier === "out" ? BAZY_LOT.includes(o.z) : BAZY_LOT.includes(o.do))) &&
      (!q || o.nr.includes(q) || o.z === q || o.do === q || (o.z + "-" + o.do).includes(q) ||
        portNazwa(d, o.do).toUpperCase().includes(q) || (o.reg || "").includes(q)));
  }
  function rysujTabeleRejsow() {
    const lista = widoczne();
    statyBox.innerHTML = "";
    statyBox.append(staty([
      ["rejsów", lista.length],
      ["pasażerów", lista.reduce((s, o) => s + o.pax, 0)],
      ["maszyn w rotacji", d.rotacje.length],
      ["z przesiadką dalej", lista.filter(o => o.dalej.length).length],
    ]));
    const KOL = "78px minmax(0,1fr) 58px 58px 66px 116px 54px";
    tabelaTresc.innerHTML = "";
    const wrap = el("div", "szeroko");
    const inner = el("div", "szeroko-in");
    const glowa = el("div", "glowa");
    glowa.style.gridTemplateColumns = KOL;
    ["Rejs", "Trasa", ST.czas === "utc" ? "STD utc" : "STD",
     ST.czas === "utc" ? "STA utc" : "STA", "Maszyna", "Obłożenie", "Dalej"]
      .forEach(h => glowa.append(el("div", "lbl", h)));
    inner.append(glowa);
    const body = el("div");
    body.style.cssText = "max-height:58vh;overflow-y:auto";
    lista.slice(0, f.ile).forEach(o => {
      const box = el("div");
      box.style.borderBottom = "1px solid var(--bd2)";
      const b = el("button", "rzad" + (f.otw === o.id ? " on" : ""));
      b.style.gridTemplateColumns = KOL;
      b.style.borderBottom = "none";
      b.innerHTML =
        `<span style="font:400 12px var(--mono);color:var(--or)">${esc(o.nr)}</span>` +
        `<span style="font:400 12px var(--sans);color:var(--tx);overflow:hidden;` +
        `text-overflow:ellipsis;white-space:nowrap">${esc(o.z)} → ${esc(o.do)} ` +
        `<span style="color:var(--tx3)">${esc(portNazwa(d, o.do))}</span></span>` +
        `<span style="font:400 11.5px var(--mono);color:var(--tx2)">${esc(godzina(d, o, "std"))}</span>` +
        `<span style="font:400 11.5px var(--mono);color:var(--tx3)">${esc(godzina(d, o, "sta"))}</span>` +
        `<span style="font:400 10.5px var(--mono);color:var(--tx3)">${esc(o.reg || "brak")}</span>` +
        `<span style="font:400 11px var(--mono);color:var(--tx2)">${o.pax}/${o.miejsca} ` +
        `<span style="color:var(--tx3)">${o.lf}%</span></span>` +
        `<span style="font:400 11px var(--mono);color:${o.dalej.length ? "var(--tx2)" : "var(--tx3)"}">` +
        `${o.dalej.reduce((a, x) => a + x.pax, 0) || "brak"}</span>`;
      b.onclick = () => { f.otw = f.otw === o.id ? null : o.id; rysujTabeleRejsow(); };
      box.append(b);
      if (f.otw === o.id) box.append(szczegolRejsu(d, o));
      body.append(box);
    });
    if (lista.length > f.ile) {
      const wiecej = el("button", "btn", `Pokaż kolejne, ${lista.length - f.ile} pozostało`);
      wiecej.style.cssText = "width:100%;border:0;border-radius:0;padding:14px";
      wiecej.onclick = () => { f.ile += 120; rysujTabeleRejsow(); };
      body.append(wiecej);
    }
    if (!lista.length) body.append(el("div", "pusto",
      '<div class="t">Brak rejsów</div><div class="d">Żaden rejs nie pasuje do tych kryteriów.</div>'));
    inner.append(body);
    wrap.append(inner);
    tabelaTresc.append(wrap);
  }
  rysujTabeleRejsow();
};

function szczegolRejsu(d, o) {
  const box = el("div");
  box.style.cssText = "padding:4px 18px 20px;background:var(--surf2)";
  const g = el("div");
  g.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));" +
    "gap:22px 28px;padding-top:18px";
  const typ = d.typy[o.typ] || {};
  const rot = d.rotacje.find(x => x.id === o.rotacja);
  const zal = (o.zaloga || []).map(id => d.zaloga.find(z => z.id === id)).filter(Boolean);

  const kol1 = el("div");
  kol1.innerHTML = `<div class="lbl" style="margin-bottom:8px">Rejs</div>` +
    wiersz("Dystans", num(o.km) + " km") +
    wiersz("Czas blokowy", hmn(o.blok)) +
    wiersz("Sektor", SEKT_PL[sektorRejsu(d, o)]) +
    wiersz("Typ", typ.nazwa || o.typ) +
    wiersz("Kategoria EU261", `${o.tier}, ${o.odszkodowanie} EUR`) +
    wiersz("Próg opieki", o.prog_opieki + " min");
  g.append(kol1);

  const kol2 = el("div");
  kol2.innerHTML = `<div class="lbl" style="margin-bottom:8px">Kabiny</div>` +
    Object.entries({ J: typ.j, PE: typ.pe, Y: typ.y }).filter(([, p]) => p > 0)
      .map(([kl, p]) => wiersz(
        kl === "J" ? "Business" : kl === "PE" ? "Premium economy" : "Economy",
        `${(o.kabiny || {})[kl] || 0} / ${p}`)).join("") +
    wiersz("Obłożenie", `${o.pax} z ${o.miejsca}, ${o.lf}%`) +
    wiersz("Kończą podróż", String(o.lokalni));
  g.append(kol2);

  const kol3 = el("div");
  const ssr = Object.entries(o.ssr || {});
  kol3.innerHTML = `<div class="lbl" style="margin-bottom:8px">Pasażerowie szczególni</div>` +
    (ssr.length ? ssr.map(([k, v]) =>
        wiersz(`${k} · ${((SLOWNIKI && SLOWNIKI.ssr[k]) || {}).grupa || ""}`, String(v))).join("")
                : `<div class="mono" style="padding:6px 0">Brak zgłoszeń SSR</div>`) +
    wiersz("Statusowi", String((o.statusy || {}).LOYALTY || 0)) +
    wiersz("Bez statusu", String((o.statusy || {}).BASE || 0));
  g.append(kol3);

  const kol4 = el("div");
  kol4.innerHTML = `<div class="lbl" style="margin-bottom:8px">Rotacja i załoga</div>` +
    (rot ? wiersz("Maszyna", rot.reg) +
           wiersz("Odcinki doby", rot.porty.join("–")) +
           wiersz("Pozycja", `${o.seq + 1} z ${rot.odcinki.length}`) : "") +
    (zal.length ? wiersz("Kokpit", zal.filter(z => z.rola !== "CABIN").map(z => z.id).join(" ") || "brak") +
           wiersz("Pokład", `${zal.filter(z => z.rola === "CABIN").length} osób`) +
           wiersz("Limit FDP", hmn(Math.min(...zal.map(z => z.fdp_limit))))
        : `<div class="mono" style="padding:6px 0">Brak przypisania załogi</div>`);
  g.append(kol4);
  box.append(g);

  const chipy = (tytul, lista, tekst) => {
    if (!lista.length) return;
    const w = el("div");
    w.style.marginTop = "18px";
    w.innerHTML = `<div class="lbl" style="margin-bottom:8px">${esc(tytul)}</div>`;
    const row = el("div");
    row.style.cssText = "display:flex;gap:6px;flex-wrap:wrap";
    lista.forEach(t => {
      const b = el("button", "zn akc");
      b.style.cursor = "pointer";
      b.textContent = tekst(t);
      b.onclick = () => otworzRejs(t.id);
      row.append(b);
    });
    w.append(row);
    box.append(w);
  };
  const trasaOf = id => {
    const x = d.rejsy.find(y => y.id === id);
    return x ? `${x.z}–${x.do}` : "";
  };
  chipy(`Lecą dalej z ${o.do}, opóźnienie zjada im zapas`, o.dalej,
    t => `${t.nr} ${trasaOf(t.id)} · ${o.z}–${t.cel} przez ${o.do} · ${t.pax} pax · zapas ${t.zapas} min`);
  chipy(`Dowozy do ${o.z}, opóźnienie daje im zapas`, o.dowozy,
    t => `${t.nr} ${trasaOf(t.id)} · ${t.z}–${o.do} przez ${o.z} · ${t.pax} pax · zapas ${t.zapas} min`);

  const akcje = el("div");
  akcje.style.marginTop = "18px";
  const b = el("button", "btn pri", "Otwórz na pulpicie");
  b.onclick = () => otworzRejs(o.id);
  akcje.append(b);
  box.append(akcje);
  return box;
}

      ["najdłuższe okno służby", wSluzbie.length

        `<span style="font:400 11px var(--sans);color:var(--tx3)">` +
        `${z.rola === "CAPTAIN" ? "kapitan" : z.rola === "FIRST_OFFICER" ? "I oficer" : "pokład"}</span>` +
        `<span style="font:400 10.5px var(--mono);color:var(--tx3)">${esc(z.baza)}</span>` +
        `<span style="font:400 11px var(--mono);color:var(--tx2);overflow:hidden;` +
        `text-overflow:ellipsis;white-space:nowrap">${esc(z.rejsy.length ? z.reg + " · " + z.trasa : "wolne")}</span>` +
        `<span style="font:400 11px var(--mono);color:var(--tx2)">${hmn(z.fdp_limit)}</span>` +
        `<div><div style="font:400 10.5px var(--mono);color:${uzycie > 90 ? "var(--or)" : "var(--tx3)"};` +
        `margin-bottom:3px">${okno ? hmn(okno) + " · " + Math.round(uzycie) + "%" : "wolne"}</div>` +

      body.append(row);

    inner.append(body);
    wrap.append(inner);
    tresc.append(wrap);
  }

/* ==========================================================================
   OPERACJE, ROTACJE
   Kazdy typ dostaje wlasna skale godzinowa, ale wspolna dla wszystkich swoich
   maszyn: proporcje czasu sa dokladne, zaden pasek nie jest rozciagany.
   ========================================================================== */
WIDOKI.rotacje = async function () {
  const host = $("#w-rotacje");
  if (!host.children.length) { host.innerHTML = ""; host.append(laduje("wczytuję dobę")); }
  let d;
  try { d = await doba(); } catch (e) { blad(host, e); return; }
  const f = F.rotacje;
  const typy = {};
  d.rotacje.forEach(r => typy[r.typ] = (typy[r.typ] || 0) + 1);
  const listaTypow = Object.entries(typy).sort((a, b) => b[1] - a[1]);
  if (!listaTypow.some(t => t[0] === f.typ)) f.typ = (listaTypow[0] || [""])[0];

  host.innerHTML = "";
  const stos = el("div", "stos");
  const filtry = karta();
  filtry.tresc.style.cssText = "display:flex;flex-direction:column;gap:10px";
  const g1 = el("div");
  g1.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start";
  g1.append(wyborDoby(() => WIDOKI.rotacje()));
  const inp = el("input");
  inp.type = "text"; inp.value = f.q;
  inp.placeholder = "Znak rejestracyjny albo numer rejsu";
  inp.style.cssText = "flex:1 1 240px;min-width:180px;height:36px;padding:0 12px;font-size:13px";
  inp.oninput = () => { f.q = inp.value; rysujGantt(); };
  g1.append(inp);
  filtry.tresc.append(g1);
  filtry.tresc.append(zakladki(listaTypow.map(([t, ile]) =>
    [t, `${(d.typy[t] || {}).nazwa || t} · ${ile}`]), f.typ,
    v => { f.typ = v; WIDOKI.rotacje(); }, { male: true }));
  const statyBox = el("div");
  filtry.tresc.append(statyBox);
  stos.append(filtry);

  const box = el("section", "karta");
  const tresc = el("div", "tresc plaska");
  box.append(tresc);
  stos.append(box);
  host.append(stos);

  const MIN_PX = 52, ETYK = 116;
  function rysujGantt() {
    const q = f.q.trim().toUpperCase();
    const wszystkie = d.rotacje.filter(r => r.typ === f.typ);
    const lista = wszystkie.filter(r => !q || r.reg.includes(q) ||
      r.odcinki.some(id => { const o = d.rejsy.find(x => x.id === id); return o && o.nr.includes(q); }));

    let minBlk = Infinity, t0 = Infinity, t1 = -Infinity;
    wszystkie.forEach(r => r.odcinki.forEach(id => {
      const o = d.rejsy.find(x => x.id === id);
      if (!o) return;
      minBlk = Math.min(minBlk, Math.max(20, o.blok));
      t0 = Math.min(t0, new Date(o.std).getTime() / 60000);
      t1 = Math.max(t1, new Date(o.sta).getTime() / 60000);
    }));
    if (!isFinite(minBlk)) { tresc.innerHTML = ""; return; }
    const od = Math.floor(t0 / 60) * 60, doK = Math.ceil(t1 / 60) * 60;
    const span = Math.max(60, doK - od);
    const dostepne = Math.max(320, (tresc.clientWidth || 900) - ETYK - 2);
    /* Skala musi spelnic dwa warunki naraz: najkrotszy odcinek typu ma zmiescic
       swoja etykiete, a cala os ma dociagnac do szerokosci ekranu. */
    const px = Math.min(3.2, Math.max(0.12, MIN_PX / minBlk, dostepne / span));
    const szer = Math.round(span * px);
    const krok = [15, 30, 60, 120, 180, 240, 360, 720].find(k => k * px >= 58) || 720;

    statyBox.innerHTML = "";
    statyBox.append(staty([
      ["maszyn", lista.length],
      ["odcinków", lista.reduce((s, r) => s + r.odcinki.length, 0)],
      ["najkrótszy odcinek", hmn(minBlk)],
      ["okno typu", Math.round(span / 60) + " h"],
    ]));

    tresc.innerHTML = "";
    const wrap = el("div", "gantt-wrap");
    const inner = el("div");
    inner.style.minWidth = (ETYK + szer) + "px";

    const ruler = el("div", "gantt-ruler");
    ruler.append(el("div", "gantt-etyk", '<div class="lbl">Maszyna</div>'));
    const rulerTor = el("div");
    rulerTor.style.cssText = `position:relative;width:${szer}px;height:34px;flex:none`;
    for (let t = od; t <= doK; t += krok) {
      const x = (t - od) * px;
      const tik = el("div", "gantt-tik");
      tik.style.cssText = `left:${x}px;padding-left:4px;height:34px`;
      const doba_ = Math.floor(t / 1440) - Math.floor(od / 1440);
      tik.innerHTML = `<span style="font:400 9px var(--mono);color:var(--tx3);white-space:nowrap">` +
        `${hhmm(new Date(t * 60000).toISOString(), 0)}` +
        `${doba_ > 0 ? `<span style="color:var(--or)">+${doba_}</span>` : ""}</span>`;
      rulerTor.append(tik);
    }
    ruler.append(rulerTor);
    inner.append(ruler);

    lista.forEach(r => {
      const row = el("div", "gantt-row");
      const legs = r.odcinki.map(id => d.rejsy.find(x => x.id === id)).filter(Boolean);
      const reg = el("div", "gantt-reg");
      reg.innerHTML = `<div class="r">${esc(r.reg)}</div>` +
        `<div class="s">${legs.length} odc. · ${esc(r.porty[0])}</div>`;
      row.append(reg);
      const tor = el("div", "gantt-tor");
      tor.style.width = szer + "px";
      for (let t = od; t <= doK; t += krok) {
        const tik = el("div", "gantt-tik");
        tik.style.left = ((t - od) * px) + "px";
        tor.append(tik);
      }
      legs.forEach(o => {
        const a = new Date(o.std).getTime() / 60000, b = new Date(o.sta).getTime() / 60000;
        const seg = el("div", "gantt-odc");
        seg.style.left = ((a - od) * px) + "px";
        seg.style.width = Math.max(6, (b - a) * px) + "px";
        seg.innerHTML = `<span>${esc(o.nr)} ${esc(o.z)}–${esc(o.do)}</span>`;
        czuly(seg, `${o.nr} ${o.z} → ${o.do}`, [
          ["odlot", godzina(d, o, "std"), AKC()],
          ["przylot", godzina(d, o, "sta"), null],
          ["blok", hmn(o.blok), null],
          ["pasażerów", `${o.pax} z ${o.miejsca}`, null],
        ]);
        seg.onclick = () => otworzRejs(o.id);
        tor.append(seg);
      });
      row.append(tor);
      inner.append(row);
    });
    wrap.append(inner);
    tresc.append(wrap);
  }
  rysujGantt();
};

WIDOKI.raporty = async function () {
  const host = $("#w-raporty");
  if (!host.children.length) {
    host.innerHTML = "";
    const r = el("div", "rozdzial");
    r.innerHTML = '<div class="lista" id="r-lista"></div><div id="r-out"></div>';
    const pasek = el("div");
    pasek.style.marginBottom = "14px";
    const b = el("button", "btn", "Odśwież listę");
    b.onclick = () => WIDOKI.raporty();
    pasek.append(b);
    host.append(pasek, r);
  }
  const lista = $("#r-lista");
  try {
    const d = await api("/api/runs");
    /* ST.moje trzyma obiekty z opisem runu, wiec porownanie idzie po `id`. */
    const kolejnosc = ST.moje.map(x => x.id);
    const moje = d.runs.filter(r => kolejnosc.includes(r.id));
    moje.sort((a, b) => kolejnosc.indexOf(a.id) - kolejnosc.indexOf(b.id));
    LICZ.raporty = moje.length;
    budujNav();
    lista.innerHTML = "";
    if (!moje.length) {
      lista.innerHTML = '';
      $("#r-out").innerHTML = "";
      $("#r-out").append(el("div", "pusto",
        '<div class="t">Brak raportów</div>'));
      return;
    }
    moje.forEach(r => {
      const meta = ST.moje.find(x => x.id === r.id) || {};
      const b = el("button");
      b.dataset.id = r.id;
      b.innerHTML =
        `<span class="rid">${esc(meta.nr || r.id)} ${esc(meta.trasa || "")}</span>` +
        `<span class="rm">${esc(DNI[meta.dzien] || "")} ${esc(dataPelna(meta.data || ""))}` +
        `${meta.nadsprzedaz ? ` · nadsprzedaż +${meta.nadsprzedaz}` : ""}` +
        `${meta.min ? ` · +${meta.min} min` : ""}` +
        `${meta.decyzja ? ` · ${esc(meta.decyzja)}` : ""}</span>`;
      b.onclick = () => pokazRun(r.id);
      lista.append(b);
    });
  } catch (e) { blad(lista, e); }
};

async function pokazRun(id) {
  const out = $("#r-out");
  if (!out) { idzDo("raporty", true); setTimeout(() => pokazRun(id), 400); return; }
  $$("#r-lista button").forEach(x => x.classList.toggle("on", x.dataset.id === id));
  out.classList.add("przyciemnij");
  if (!out.children.length) { out.innerHTML = ""; out.append(laduje("wczytuję run")); }
  try {
    const d = await api(`/api/run?id=${encodeURIComponent(id)}`);
    out.innerHTML = "";
    const meta = ST.moje.find(x => x.id === id) || {};
    const stos = el("div", "stos");
    const naglowek = el("div");
    naglowek.style.cssText = "display:flex;align-items:baseline;gap:14px;flex-wrap:wrap";
    naglowek.innerHTML =
      `<span style="font:400 22px/1 var(--mono);color:var(--or)">${esc(meta.nr || d.id)}</span>` +
      `<span style="font:400 16px/1 var(--mono);color:var(--tx)">${esc(meta.trasa || "")}</span>` +
      `<span style="font:400 12px var(--sans);color:var(--tx2)">` +
      `${esc(DNIL[meta.dzien] || "")} ${esc(dataPelna(meta.data || ""))}</span>` +
      `<span class="zn">${esc(d.tryb)}</span>` +
      (meta.min ? `<span class="zn akc">+${meta.min} min</span>` : "") +
      (meta.nadsprzedaz ? `<span class="zn akc">nadsprzedaż +${meta.nadsprzedaz}</span>` : "");
    stos.append(naglowek);

    const kr = karta("Raporty");
    const rzad = el("div");
    rzad.style.cssText = "display:flex;gap:8px;flex-wrap:wrap";
    RODZAJE_RAPORTU.forEach(x => {
      const gotowy = (RAPORTY_AI[id] || {})[x.k];
      const b = el("button", "btn" + (gotowy && !gotowy.laduje ? " akt" : ""),
        gotowy && gotowy.laduje ? "…" : x.n);
      b.disabled = !!(gotowy && gotowy.laduje);
      b.onclick = () => generujRaport(id, x.k);
      rzad.append(b);
    });
    kr.tresc.append(rzad);
    RODZAJE_RAPORTU.forEach(x => {
      const wynik = (RAPORTY_AI[id] || {})[x.k];
      if (!wynik || wynik.laduje) return;
      const box = el("div");
      box.style.cssText = "margin-top:14px;padding-top:14px;border-top:1px solid var(--bd2)";
      box.append(el("div", "lbl", x.n));
      if (wynik.error) { box.append(komunikat("blad", esc(wynik.error))); }
      else if (wynik.text) {
        const pre = el("pre");
        pre.textContent = wynik.text;
        box.append(pre);
      } else {
        box.append(komunikat("info",
          `Prompt złożony z raportów tego runu, zapisany do ` +
          `<code>out/run_${esc(id)}/${esc(wynik.persona)}.prompt.txt</code>.`));
      }
      if (wynik.guard) {
        const g = wynik.guard;
        box.append(komunikat(g.clean ? "ok" : "blad",
          g.clean ? `Strażnik liczb: czysto, ${g.allowed_pool} wartości w puli.`
                  : `Strażnik liczb: ${esc(g.summary)}`));
      }
      kr.tresc.append(box);
    });
    stos.append(kr);
    const rep = d.raporty;
    const mk = karta("Podsumowanie runu");
    mk.tresc.append(metryki([
      ["Etapów", rep.length],
      ["Degradowanych", rep.filter(r => r.status === "degraded").length],
      ["Zablokowanych", rep.filter(r => r.status === "blocked").length],
      ["Ostrzeżeń", rep.reduce((a, r) => a + (r.json.warnings || []).length, 0)],
      ["Braków danych", rep.reduce((a, r) => a + (r.json.data_gaps || []).length, 0)],
    ]));
    stos.append(mk);

    const c = karta("Etapy runu");
    c.tresc.className = "tresc plaska";
    c.tresc.append(tabela([
      { t: "Etap", get: r => r.node, mocno: true },
      { t: "Tytuł", get: r => r.tytul },
      { t: "Status", raw: true, get: r => zn(r.status), val: r => r.status },
      { t: "Ostrz.", num: true, get: r => (r.json.warnings || []).length,
        val: r => (r.json.warnings || []).length },
      { t: "Braki", num: true, get: r => (r.json.data_gaps || []).length,
        val: r => (r.json.data_gaps || []).length },
    ], rep));
    stos.append(c);

    const koszt = rep.find(r => r.node === "09");
    if (koszt) { const w = wykKoszt(koszt.json); if (w) stos.append(w); }

    const acc = el("div", "stos");
    acc.style.gap = "7px";
    acc.append(el("div", "lbl", "Raporty etapów"));
    rep.forEach(r => {
      const det = el("details", "rap");
      const sum = el("summary");
      sum.innerHTML = `<span class="mono">${esc(r.node)}</span>` +
        `<span class="sp">${esc(r.tytul)}</span>${zn(r.status)}`;
      det.append(sum);
      const pre = el("pre");
      pre.textContent = r.markdown;         /* tresc raportu, nie HTML */
      det.append(pre);
      acc.append(det);
    });
    stos.append(acc);
    out.append(stos);
  } catch (e) { blad(out, e); }
  finally { out.classList.remove("przyciemnij"); }
}

/** Struktura kosztu opcji. Ogon poza siedmioma pozycjami skada sie w "pozostale",
    zamiast generowac osmy odcien. Kolor idzie za nazwa pozycji, nie za wierszem. */
function wykKoszt(koszt) {
  const src = (koszt.findings || {}).koszty_opcji || [];
  if (!src.length) return null;
  const S = SERIE(), inne = CSSv("--sOther");
  const waga = new Map();
  src.forEach(r => (r.najwieksze || []).forEach(p =>
    waga.set(p.pozycja, (waga.get(p.pozycja) || 0) + mv(p.kwota))));
  const kolejnosc = [...waga.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]).slice(0, 7);
  const mapa = new Map(kolejnosc.map((k, i) => [k, S[i]]));
  const kolorOf = k => mapa.get(k) || inne;
  const wiersze = src.map(r => {
    const total = mv(r.koszt);
    const parts = [];
    let acc = 0;
    kolejnosc.forEach(k => {
      const hit = (r.najwieksze || []).find(p => p.pozycja === k);
      if (hit) { const v = mv(hit.kwota); parts.push({ key: k, value: v }); acc += v; }
    });
    const reszta = Math.max(0, total - acc);
    if (reszta > 0.005) parts.push({ key: "pozostałe składniki", value: reszta });
    return { label: r.id, total, parts, _r: r };
  });
  const legenda = kolejnosc.map(k => [k, kolorOf(k)]);
  if (wiersze.some(r => r.parts.some(p => p.key === "pozostałe składniki")))
    legenda.push(["pozostałe składniki", inne]);
  const wt = [];
  wiersze.forEach(r => r.parts.forEach(p =>
    wt.push({ opcja: r.label, tryb: r._r.tryb, poz: p.key, kwota: p.value, total: r.total })));
  return wykres({
    tytul: "Struktura kosztu opcji",
    svg: wykSkladane(wiersze, kolorOf, { labelW: 160, fmt: v => compact(v) + " zł" }),
    legenda,
    tabela: tabela([
      { t: "Opcja", get: r => r.opcja, mocno: true },
      { t: "Tryb", get: r => r.tryb },
      { t: "Pozycja kosztu", get: r => r.poz },
      { t: "Kwota", num: true, get: r => NF.format(r.kwota), val: r => r.kwota },
      { t: "Koszt opcji", num: true, get: r => NF.format(r.total), val: r => r.total },
    ], wt, { sort: 3, dir: -1 }),
  });
}

  if (u.panel === "hidden") { document.body.classList.add("hidepanel"); $("#pokaz-panel").hidden = false; }
  if (typeof u.priorytet === "number") ST.priorytet = u.priorytet;
  if (u.preset) ST.preset = u.preset;
  if (typeof u.skala === "number") ST.skala = u.skala;
  if (typeof u.kratka === "number") ST.kratka = u.kratka;
  if (typeof u.domMin === "number") ST.domMin = u.domMin;
  zastosujSkale();
  $("#kratka").hidden = !ST.kratka;
  if (typeof u.dzien === "number") ST.dzien = u.dzien;
  if (u.czas) ST.czas = u.czas;

  budujNav();
  idzDo("pulpit");
  nowaKarta();

  wczytajZdrowie();

     odczyty leca z pamieci podrecznej serwera. */
  doba().then(() => { rysujPasekKart(); if (ST.widok === "pulpit") WIDOKI.pulpit(); }).catch(() => {});

})();
